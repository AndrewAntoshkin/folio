[project]
name = "ds-eval"
version = "0.1.0"
description = "Benchmark how well coding agents use a design system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
runtime = ["playwright>=1.45"]
dev = ["pytest>=8.0"]

[project.scripts]
ds-eval = "ds_eval.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
