<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morph Tooltip</title>

<style>
/* Motion Studies design tokens.
   Single source of truth for color, type, radius and motion.
   Edit here (or in Claude Design) and every component follows. */
:root{
  /* ---------- color ---------- */
  --stage:#000;                         /* page background */
  --card:#171717;                       /* component stage card (= white 9% on black) */
  --surface:#262626;                    /* component body */
  --fill-1:rgba(255,255,255,.05);       /* tiles, fields */
  --fill-2:rgba(255,255,255,.09);       /* chips, badges */
  --fill-3:rgba(255,255,255,.14);       /* tracks, avatars, bars */
  --line:rgba(255,255,255,.12);
  --text:#fff;
  --text-2:rgba(255,255,255,.78);
  --muted:#9a9a9a;
  --muted-2:#828282;
  --chip-text:#b4b4b4;
  --white:#fff;
  --black:#000;
  --green:#34d17a;
  --green-text:#3ce085;
  --orange:#ff9f0a;
  --orange-text:#ff9f0a;                /* orange used as text: darker in light */
  --red:#ff5a5f;
  --yellow:#ffd23f;
  --blue:#3ec9ff;
  --purple:#c69bff;
  --pink:#ff6ad5;
  --heart:#ff4d6d;                      /* like, favourite */
  --green-soft:rgba(52,209,122,.14);    /* tinted chip behind green text */
  --on-green:#04140a;                   /* text and checks on --green, same in both themes */
  --object:#2c2c2c;                     /* a free-standing grey object with no card under it: island, goo bubbles */
  --inverse:#fff;                       /* primary pills, thumbs, drops */
  --on-inverse:#000;                    /* content on top of --inverse */
  --rim:transparent;          /* no strokes anywhere (Noah, 9 Nov 2026) */ /* 1px inner edge on surfaces */
  --focus-rim:transparent;
  --glow:rgba(255,255,255,.16);         /* cursor light on tiles */
  --sh:0;                               /* drop shadow strength multiplier; 0 = no shadows anywhere (Noah, 9 Nov 2026) */
  color-scheme:dark;

  /* ---------- type ---------- */
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-2xs:11px;
  --fs-xs:12px;
  --fs-sm:13px;
  --fs-md:14px;
  --fs-base:15px;
  --fs-lg:16px;
  --fs-xl:17px;
  --fw-regular:400;
  --fw-medium:500;
  --fw-bold:600;

  /* ---------- radius ---------- */
  --r-card:28px;
  --r-tile:14px;
  --r-bar:5px;
  --r-pill:999px;
  /* inner radius = outer radius - the padding between them. Usual steps: */
  --r-xs:6px;                           /* keys, tiny chips */
  --r-row:12px;                         /* rows, icon buttons, highlights inside a panel */
  --r-panel:18px;                       /* bars, menus, small panels */
  --r-sheet:24px;                       /* large panels */

  /* ---------- motion: springs are "stiffness damping" ---------- */
  /* Shared presets. A new component starts from these and only adds its own token when it truly needs a different feel. */
  --spring-follow:900 50;      /* something held by the pointer: no overshoot, no lag */
  --spring-settle:280 22;      /* letting go, landing on a value: one small overshoot */
  --spring-soft:260 24;        /* large moves: panels, sheets, the whole component shifting */
  --spring-lead:620 36;        /* stretchy highlight: the edge facing the move */
  --spring-trail:190 19;       /* stretchy highlight: the edge that lags, this makes the stretch */
  --spring-pop:520 16;         /* icon or number pop on select */
  --spring-fade:420 32;        /* opacity and small slides */
  --stagger:45;                /* ms between items entering one after another */
  /* Rubber Dock */
  --dock-lead:640 38;          /* edge of the pill that leads the move */
  --dock-trail:150 16;         /* edge that lags behind: lower = more stretch */
  --dock-drag-lead:1100 56;
  --dock-drag-trail:320 26;
  --dock-open-w:340 21;        /* dock -> card, width */
  --dock-open-h:230 21;        /* dock -> card, height */
  --dock-close:420 30;
  --dock-pop:520 16;           /* icon pop on select */
  --dock-expanded-w:340;       /* px */

  /* Goo Menu */
  --goo-out:230 15;            /* bubbles flying out */
  --goo-in:520 34;             /* bubbles returning */
  --goo-release:300 12;        /* snap back after a drag */
  --goo-toast:260 17;          /* + morphing into the toast pill */
  --goo-radius:112;            /* px, distance of bubbles from + */
  --goo-stagger:45;            /* ms between bubbles */
  --goo-toast-ms:2600;         /* how long the toast stays */
  --goo-blur:10;               /* goo strength: higher = bubbles fuse from further away */

  /* Morph Island */
  --island-w:380 24;           /* width morph */
  --island-h:300 22;           /* height morph, a bit softer so it lands after the width */
  --island-radius:32;          /* px, max corner radius when tall */
  --island-cycle-ms:2800;      /* autoplay step until the viewer interacts */

  /* Hold Button */
  --hold-ms:1200;              /* how long to hold */
  --hold-release:260 14;       /* fill springing back when let go early */
  --hold-morph:320 20;         /* pill <-> circle */
  --hold-done-ms:1700;         /* how long the done state stays */

  /* Jelly Slider */
  --slider-follow:900 50;      /* thumb following the pointer */
  --slider-bubble:420 22;      /* value bubble rising out of the thumb */
  --slider-release:300 14;     /* snap back after over-drag */
  --slider-blur:8;             /* goo strength between thumb and bubble */

  /* Swipe Deck */
  --deck-drag:900 50;          /* top card following the pointer */
  --deck-return:280 16;        /* snapping back when not thrown far enough */
  --deck-threshold:110;        /* px of drag that counts as a decision */

  /* Springy Input */
  --input-caret:700 32;        /* caret travel; it stretches with speed */
  --input-morph:300 20;        /* field <-> success pill */

  /* Pull to Refresh */
  --pull-threshold:88;         /* px of pull that triggers a refresh */
  --pull-return:260 18;        /* list springing back */
  --pull-hold-ms:1300;         /* how long the spinner runs */

  /* Magnetic Tiles */
  --tile-pull:12;              /* px a tile moves toward the cursor */
  --tile-tilt:12;              /* deg of 3D tilt */
  --tile-open:300 24;          /* tile -> card morph */

  /* Glass Lens */
  --lens-follow:180 17;        /* lens chasing the cursor, a little lazy like a drop of water */
  --lens-zoom:1.7;             /* magnification at rest */
  --lens-zoom-press:2.4;       /* magnification while pressed */
  --lens-size:150;             /* px */

  /* Morph Select */
  --select-open:360 24;        /* trigger <-> menu */
  --select-hl:620 34;          /* highlight pill edges (leading edge) */
  --select-reorder:260 21;     /* rows sliding to their new place */

  /* Parallax Ticket */
  --ticket-tilt:14;            /* deg */
  --ticket-depth:12;           /* px of parallax for the front layer */
  --ticket-flip:170 15;        /* flip spring, a little overshoot */

  /* Wheel Picker */
  --wheel-snap:240 24;         /* settling on the nearest value */
  --wheel-decay:5;             /* momentum decay per second: lower = spins longer */

  /* Trends */
  --trend-menu:330 25;         /* "..." button growing into the menu */
  --trend-fly:260 20;          /* the three dots flying into the menu icons */
  --trend-row:300 28;          /* row height: dismiss, undo, show more */
  --trend-live-ms:2200;        /* how often a post count rolls */
  --trend-tick-ms:1100;        /* how often the charts get a new point */
  --trend-expand:280 24;       /* row opening into the big chart */
  --trend-rank:260 22;         /* rows swapping places when the ranking changes */

  /* Side Nav */
  --nav-lead:560 34;           /* hover pill: edge moving toward the new item */
  --nav-trail:220 21;          /* hover pill: edge catching up, this makes it stretch */

  /* Rolling Counter */
  --count-roll:320 24;         /* each digit column rolling to its value: lower damping = more bounce */
  --count-width:380 22;        /* columns growing in and folding away, this stretches the pill */
  --count-press:600 18;        /* button squash, number pop and lean */
  --count-stagger:45;          /* ms each higher column waits, so a carry ripples left */
  --count-blur:1;              /* motion blur strength, 0 = off */
  --count-decay:3.5;           /* fling decay per second: lower = coasts longer */
  --count-snap:260 24;         /* ruler settling on the nearest tick */
  --count-gap:14;              /* ruler: px between ticks */
  --count-fisheye:60;          /* ruler: how much ticks swell near the marker, 0..100 */
  --count-flip:140;            /* split flap: ms per fold */
}

/* ---------- light mode ---------- */
:root[data-theme="light"]{
  --stage:#fff;
  --card:#f7f7f6;
  --surface:#fff;
  --fill-1:rgba(23,24,26,.04);
  --fill-2:rgba(23,24,26,.07);
  --fill-3:rgba(23,24,26,.12);
  --line:rgba(23,24,26,.16);
  --text:#17181a;
  --text-2:#3c3b37;
  --muted:#6f6e68;
  --muted-2:#85847e;
  --chip-text:#5c5b56;
  --green-text:#15803d;
  --orange-text:#c2660a;
  --object:#e6e5e2;
  --inverse:#0e0f11;
  --on-inverse:#f4f3f1;
  --rim:transparent;
  --focus-rim:transparent;
  --glow:rgba(23,24,26,.06);
  --sh:0;
  color-scheme:light;
}

/* ---------- both themes at once ----------
   For a component that shows the dark and the light look side by side (Pull cord:
   the light floods out of the bulb). Same values as the two blocks above, colour only. */
.theme-dark{
  --card:#171717;--surface:#262626;--object:#2c2c2c;
  --fill-1:rgba(255,255,255,.05);--fill-2:rgba(255,255,255,.09);--fill-3:rgba(255,255,255,.14);
  --text:#fff;--text-2:rgba(255,255,255,.78);--muted:#9a9a9a;--muted-2:#828282;
  --inverse:#fff;--on-inverse:#000;color-scheme:dark;
}
.theme-light{
  --card:#f7f7f6;--surface:#fff;--object:#e6e5e2;
  --fill-1:rgba(23,24,26,.04);--fill-2:rgba(23,24,26,.07);--fill-3:rgba(23,24,26,.12);
  --text:#17181a;--text-2:#3c3b37;--muted:#6f6e68;--muted-2:#85847e;
  --inverse:#0e0f11;--on-inverse:#f4f3f1;color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--card);color:var(--text);overflow:hidden;
  font-family:var(--font);-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
.badge{
  position:absolute;left:14px;top:14px;z-index:3;
  font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--text);
  background:var(--fill-2);border-radius:var(--r-pill);padding:4px 10px;
}

/* Avatars and card art: grainy mesh, mixed (Noah, 12 Nov 2026).
   Three soft spots of colour melt over a main colour, under a fine grain.
   Each family is turned a different way (--p1..3), so the light spot and the deep spot
   never sit in the same corner twice and a row of them does not read as one recipe. */

/* Morph Tooltip: one tooltip for the whole toolbar. It never hides between
   tools, it stretches over to the next one and changes its width to fit. */
.tools{
  position:absolute;left:50%;top:50%;width:288px;height:56px;
  margin:-5px 0 0 -144px;   /* tooltip (34) + gap (12) sit above, so the pair is centred */
}
.bar{position:absolute;inset:0;display:flex;gap:4px;padding:6px;border-radius:18px;background:var(--surface)}
.tool{
  position:relative;z-index:1;flex:none;width:52px;height:44px;padding:0;border:0;border-radius:12px;background:none;
  color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:color .18s;
  -webkit-tap-highlight-color:transparent;
}
.tool svg{width:22px;height:22px;display:block;will-change:transform}
.tool[aria-pressed="true"]{color:var(--text)}
.tool:focus-visible{outline:2px solid var(--text-2);outline-offset:-2px}
.hl{position:absolute;left:0;top:6px;height:44px;border-radius:12px;background:var(--fill-2);opacity:0;pointer-events:none;will-change:transform,width}

.tip{
  position:absolute;left:0;bottom:calc(100% + 12px);height:34px;border-radius:11px;overflow:hidden;
  background:var(--inverse);color:var(--on-inverse);opacity:0;pointer-events:none;
  transform-origin:50% 140%;will-change:transform,width,opacity;
}
.lab{
  position:absolute;left:50%;top:0;height:34px;display:flex;align-items:center;gap:8px;padding:0 7px 0 12px;
  white-space:nowrap;font-size:var(--fs-sm);font-weight:var(--fw-medium);letter-spacing:-.005em;opacity:0;will-change:transform,opacity;
}
.lab kbd{
  font:inherit;font-size:var(--fs-2xs);font-weight:var(--fw-bold);min-width:20px;height:20px;padding:0 5px;border-radius:6px;
  display:grid;place-items:center;background:color-mix(in srgb,var(--on-inverse) 12%,transparent);
}
.tail{
  position:absolute;left:0;bottom:calc(100% + 9px);width:12px;height:12px;border-radius:3px;
  background:var(--inverse);opacity:0;pointer-events:none;will-change:transform,opacity;
}

<body>
<div class="tools" id="tools">
  <i class="tail" id="tail"></i>
  <div class="tip" id="tip" role="tooltip">
    <span class="lab">Move<kbd>V</kbd></span>
    <span class="lab">Frame<kbd>F</kbd></span>
    <span class="lab">Pen<kbd>P</kbd></span>
    <span class="lab">Text<kbd>T</kbd></span>
    <span class="lab">Comment<kbd>C</kbd></span>
  </div>
  <div class="bar" id="bar" role="toolbar" aria-label="Tools">
    <i class="hl" id="hl"></i>
    <button class="tool" aria-label="Move, V" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg></button>
    <button class="tool" aria-label="Frame, F" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6H2M22 18H2M6 2v20M18 2v20"/></svg></button>
    <button class="tool" aria-label="Pen, P" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.707 21.293a1 1 0 0 1-1.414 0l-1.586-1.586a1 1 0 0 1 0-1.414l5.586-5.586a1 1 0 0 1 1.414 0l1.586 1.586a1 1 0 0 1 0 1.414z"/><path d="m18 13-1.375-6.874a1 1 0 0 0-.746-.776L3.235 2.028a1 1 0 0 0-1.207 1.207L5.35 15.879a1 1 0 0 0 .776.746L13 18"/><path d="m2.3 2.3 7.286 7.286"/><circle cx="11" cy="11" r="2"/></svg></button>
    <button class="tool" aria-label="Text, T" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg></button>
    <button class="tool" aria-label="Comment, C" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></button>
  </div>
</div>
<script>
// Tiny spring engine shared by every component.
// Springs, sim-time timers (so slow-mo slows them too), one rAF loop, and token readers.
window.Motion = (() => {
  // theme: shared by every page through localStorage, live-updated by the gallery
  const setTheme = t => { document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'; };
  try { setTheme(localStorage.getItem('ms-theme')); } catch { setTheme('dark'); }
  addEventListener('storage', e => { if (e.key === 'ms-theme') setTheme(e.newValue); });

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const S = (x, k = 400, c = 30) => ({ x, v: 0, t: x, k, c });
  const tune = (s, k, c) => { s.k = k; s.c = reduce ? 2 * Math.sqrt(k) : c; };
  const step = (s, dt) => { const a = -s.k * (s.x - s.t) - s.c * s.v; s.v += a * dt; s.x += s.v * dt; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // tokens from shared/tokens.css
  const token = (name, fallback = '') =>
    getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  const num = (name, fallback) => parseFloat(token(name, String(fallback)));
  const spring = (name, fallback) => token(name, fallback).split(/\s+/).map(Number);

  let timeScale = 1;
  const timers = [];
  const after = (sec, fn) => { const t = { t: sec, fn }; timers.push(t); return t; };
  const cancel = t => { const i = timers.indexOf(t); if (i > -1) timers.splice(i, 1); };

  // slow motion, synced with a parent page when embedded
  const slowListeners = [];
  function setSlow(v, fromParent = false) {
    timeScale = v ? .25 : 1;
    slowListeners.forEach(f => f(v));
    if (!fromParent && parent !== window) parent.postMessage({ type: 'motion:slow-changed', on: v }, '*');
  }
  addEventListener('message', e => {
    if (e.data && e.data.type === 'motion:slow') setSlow(!!e.data.on, true);
    if (e.data && e.data.type === 'motion:theme') setTheme(e.data.theme);
  });

  const comps = [];
  let last = performance.now();
  const labStill = new URLSearchParams(location.search).get('still') === '1';
  let labOn = !labStill;
  addEventListener('message', e => {
    if (!e.data) return;
    if (e.data === 'lab:stop') labOn = false;
    if (e.data === 'lab:play') { labOn = true; last = performance.now(); requestAnimationFrame(loop); }
  });
  window.__labStop = () => { labOn = false; };
  function loop(now) {
    const live = labOn;
    const dt = live ? Math.min((now - last) / 1000, 1 / 30) * timeScale : 0;
    last = now;
    if (live) {
      for (let i = timers.length - 1; i >= 0; i--) {
        if ((timers[i].t -= dt) <= 0) timers.splice(i, 1)[0].fn();
      }
      const sub = 4;
      for (let k = 0; k < sub; k++) comps.forEach(c => c.frame(dt / sub));
    }
    comps.forEach(c => { if (c.render) c.render(); });
    if (live) requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  return {
    S, tune, step, clamp, token, num, spring, after, cancel,
    register: c => comps.push(c),
    get timeScale() { return timeScale; },
    get slow() { return timeScale !== 1; },
    setSlow, onSlow: f => slowListeners.push(f),
    svg: (p, sw = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`,
  };
})();

</script>
<script>
// Morph Tooltip
// One tooltip serves every tool. The first hover pops it in place. After that
// it travels: the edge facing the new tool is on a stiff spring and the other
// edge on a soft one, so it stretches across and settles at the new label's
// width. The old label slides out the way it came, the new one slides in from
// the far side, and the little tail follows on its own spring. Leaving the bar
// waits a moment before hiding, so crossing a gap never flickers.
(() => {
  const { S, tune, step, clamp, after, cancel } = Motion;
  const $ = id => document.getElementById(id);
  const tip = $('tip'), tail = $('tail'), hl = $('hl'), bar = $('bar'), group = $('tools');
  const tools = [...document.querySelectorAll('.tool')].map(el => ({ el, ic: el.firstElementChild, p: S(1, 520, 16) }));
  const labs = [...document.querySelectorAll('.lab')].map(el => ({ el, o: S(0, 420, 32), dir: 0, w: 96 }));
  const BW = 52, GAP = 4, PAD = 6, LEAD = [620, 36], TRAIL = [190, 19];
  const cx = i => PAD + i * (BW + GAP) + BW / 2;

  const TL = S(0, ...LEAD), TR = S(0, ...LEAD), TX = S(0, 300, 22);   // tooltip edges, tail centre
  const HL = S(0, ...LEAD), HR = S(0, ...LEAD);                        // hover highlight edges
  const A = S(0, 420, 24);                                             // shown
  let cur = -1, hideT = null, clock = 0, userUntil = 0;

  function place(i, snap) {
    const c = cx(i), half = labs[i].w / 2;
    const to = [[TL, c - half], [TR, c + half], [TX, c], [HL, c - BW / 2], [HR, c + BW / 2]];
    to.forEach(([s, v]) => { s.t = v; if (snap) { s.x = v; s.v = 0; } });
  }
  const measure = () => { labs.forEach(l => { l.w = l.el.offsetWidth || l.w; }); if (cur > -1) place(cur, false); };
  measure();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  function point(i) {
    if (hideT) { cancel(hideT); hideT = null; }
    if (i === cur) { A.t = 1; return; }
    const dir = cur < 0 ? 0 : Math.sign(i - cur);
    if (A.x < .3) {
      // nothing on screen yet: appear where it is needed
      place(i, true);
      labs.forEach((l, k) => { l.o.x = l.o.t = k === i ? 1 : 0; l.o.v = 0; l.dir = 0; });
    } else {
      const right = dir >= 0;
      [TR, HR].forEach(s => tune(s, ...(right ? LEAD : TRAIL)));
      [TL, HL].forEach(s => tune(s, ...(right ? TRAIL : LEAD)));
      place(i, false);
      labs.forEach((l, k) => {
        if (k === i) { l.dir = dir; l.o.t = 1; }
        else if (l.o.t === 1) { l.dir = -dir; l.o.t = 0; }
      });
    }
    cur = i; A.t = 1;
  }
  function leave() {
    if (hideT) cancel(hideT);
    hideT = after(.14, () => { hideT = null; A.t = 0; cur = -1; });
  }
  function select(i) {
    tools.forEach((t, k) => t.el.setAttribute('aria-pressed', k === i));
    tools[i].p.x = .78; A.x = Math.min(A.x, .9);
  }

  tools.forEach((t, i) => {
    t.el.addEventListener('pointerenter', () => { userUntil = clock + 5; point(i); });
    t.el.addEventListener('focus', () => { userUntil = clock + 5; point(i); });
    t.el.addEventListener('blur', leave);
    t.el.addEventListener('click', () => { userUntil = clock + 5; point(i); select(i); });
  });
  bar.addEventListener('pointermove', () => { userUntil = clock + 5; });
  bar.addEventListener('pointerleave', leave);

  // idle: walk the toolbar by itself, pick a tool now and then, leave, repeat
  const SEQ = [0, 1, 2, 3, 4, 2, 0, 3];
  let si = 0;
  (function auto() {
    if (clock >= userUntil) {
      if (si === SEQ.length) { leave(); after(.4, () => window.__labStop()); return; }
      const i = SEQ[si++];
      point(i);
      if (si % 3 === 0) after(.5, () => { if (clock >= userUntil && cur === i) select(i); });
    }
    after(1.05, auto);
  })();

  Motion.register({
    frame(dt) {
      clock += dt;
      [TL, TR, TX, HL, HR, A].forEach(s => step(s, dt));
      labs.forEach(l => step(l.o, dt));
      tools.forEach(t => step(t.p, dt));
    },
    render() {
      const a = clamp(A.x, 0, 1.15), op = clamp(A.x, 0, 1);
      // narrow stage: the bar scales down to keep 16px each side, and the tooltip
      // stays inside the stage while its tail keeps pointing at the tool
      const sw = group.parentElement.clientWidth || 400, sc = Math.min(1, (sw - 32) / 288), lim = (sw / 2 - 8) / sc;
      group.style.transform = sc < 1 ? `scale(${sc.toFixed(4)})` : '';
      const l0 = Math.min(TL.x, TR.x - 30), w = TR.x - l0;
      const l = clamp(l0, 144 - lim, Math.max(144 - lim, 144 + lim - w));
      tip.style.width = w.toFixed(2) + 'px';
      tip.style.opacity = op.toFixed(3);
      tip.style.transform = `translate(${l.toFixed(2)}px,${((1 - a) * 6).toFixed(2)}px) scale(${(.72 + .28 * a).toFixed(4)})`;
      const tx = clamp(TX.x, l + 12, l + w - 12);
      tail.style.opacity = op.toFixed(3);
      tail.style.transform = `translate(${(tx - 6).toFixed(2)}px,${((1 - a) * 8).toFixed(2)}px) rotate(45deg) scale(${a.toFixed(3)})`;
      hl.style.opacity = op.toFixed(3);
      const hx = clamp(Math.min(HL.x, HR.x - 20), PAD, 288 - PAD - 20), hr = clamp(HR.x, hx + 20, 288 - PAD);
      hl.style.width = (hr - hx).toFixed(2) + 'px';
      hl.style.transform = `translateX(${hx.toFixed(2)}px)`;
      labs.forEach(lb => {
        const o = clamp(lb.o.x, 0, 1);
        lb.el.style.opacity = o.toFixed(3);
        lb.el.style.transform = `translateX(calc(-50% + ${(lb.dir * (1 - o) * 14).toFixed(2)}px))`;
        lb.el.style.filter = o > .02 && o < .98 ? `blur(${((1 - o) * 3).toFixed(2)}px)` : 'none';
      });
      tools.forEach(t => { t.ic.style.transform = `scale(${t.p.x.toFixed(4)})`; });
    },
  });
})();

</script>
</body>
</html>
