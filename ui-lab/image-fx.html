<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image generation</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{
  background:#171717;color:#fff;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;
}
.stage{height:100%;display:grid;place-items:center;padding:14px}
.col{width:min(300px,92vw);display:flex;flex-direction:column;gap:10px}
.tile{display:block}
.hit{display:block;border:0;background:none;padding:0;cursor:pointer;border-radius:20px;-webkit-tap-highlight-color:transparent}
.hit:focus-visible{outline:2px solid #9a9a9a;outline-offset:3px}
.face{width:min(300px,92vw);height:112px;border-radius:20px;background:#262626}
figcaption{margin:6px 4px 0;font-size:12px;color:#9a9a9a}
</style>
</head>
<body>
<div id="root"></div>
<script src="/ui-lab/image-fx/demo.js"></script>
</body>
</html>
