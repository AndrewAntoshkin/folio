<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image generation</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{
  background:#171717;color:#fff;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;
}
.stage{height:100%;display:grid;place-items:center;padding:14px}
.col{width:min(280px,86vw);display:flex;flex-direction:column;align-items:center;gap:16px}
.hit{display:block;border:0;background:none;padding:0;cursor:pointer;border-radius:24px;-webkit-tap-highlight-color:transparent}
.hit:focus-visible{outline:2px solid #9a9a9a;outline-offset:3px}
.face{width:min(280px,86vw);height:min(280px,86vw);border-radius:24px;background:#262626}
.pills{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.09)}
.pill{border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:500;color:#9a9a9a;background:transparent;cursor:pointer;
  transition:background .25s,color .25s;-webkit-tap-highlight-color:transparent}
.pill:hover{color:#fff}
.pill.on{background:#fff;color:#111}
.pill:focus-visible{outline:2px solid #9a9a9a;outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<script src="/ui-lab/image-fx/demo.js"></script>
</body>
</html>
