<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distortion wave</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
/* every size below is in rem, and rem follows the window, so the card scales as one piece */
html{font-size:var(--k,1px)}
body{
  background:#171717;color:#fff;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Inter,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;
}
.stage{height:100%;display:grid;place-items:center}

.deal{position:relative;width:300rem;height:367rem;border-radius:26rem;overflow:hidden;background:#1d1e26;
  box-shadow:0 0 0 1rem rgba(255,255,255,.12),0 24rem 48rem rgba(0,0,0,.35)}
.card{width:100%;height:100%;padding:25rem;background:#1d1e26;color:#fff}

.who{display:flex;align-items:center;gap:16rem}
.who .pic{flex:none;width:54rem;height:54rem;border-radius:14rem;object-fit:cover;background:#2d2f3b;display:block}
.who b{display:block;font-size:18rem;font-weight:600;letter-spacing:-.015em;line-height:1.1}
.who span{display:block;margin-top:6rem;font-size:12.5rem;line-height:1.2;color:#707285}
.rule{height:1rem;margin-top:28rem;background:rgba(255,255,255,.09)}

.sub{margin-top:30rem;height:16rem;display:flex;align-items:center;justify-content:space-between;
  font-size:13rem;font-weight:600;letter-spacing:.11em;text-transform:uppercase}
.sub i{font-style:normal;color:#7b7d8f}
.sub em{font-style:normal;color:#f3d58d}

.price{margin-top:22rem;height:42rem;display:flex;align-items:baseline;gap:12rem}
.price .now{font-size:38rem;font-weight:700;letter-spacing:-.03em;line-height:42rem}
.price .was{font-size:18rem;font-weight:500;color:#6d6f80;text-decoration:line-through;text-decoration-thickness:1.5rem;letter-spacing:-.01em}

.tags{margin-top:12rem;height:24rem;display:flex;align-items:center;gap:8rem}
.tag{height:24rem;padding:0 10rem;border-radius:8rem;background:#2c2e3a;color:#8fdb5c;font-size:12rem;line-height:24rem;white-space:nowrap}
.info{width:24rem;height:24rem;border-radius:7rem;border:1rem solid #30323f;display:grid;place-items:center;color:#6d6f80;
  font:italic 400 13rem/1 Georgia,"Times New Roman",serif}

.slot{margin-top:34rem;height:48rem;visibility:hidden}

/* the button lives in the overlay, so the wave does not bend it */
.pay{position:absolute;left:0;top:0;border:0;border-radius:12rem;background:#f6d58b;color:#15161b;cursor:pointer;
  font:600 14.5rem/1 system-ui,-apple-system,"Segoe UI",Inter,sans-serif;letter-spacing:-.005em;opacity:0;transition:opacity .2s,filter .2s}
.pay.ready{opacity:1}
.pay:active{filter:brightness(.94)}
.pay:focus-visible{outline:2rem solid #fff;outline-offset:2rem}
</style>
</head>
<body>
<div id="root"></div>
<script src="/ui-lab/distortion-wave/demo.js"></script>
</body>
</html>
