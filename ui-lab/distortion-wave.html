<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distortion wave</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{
  background:#171717;color:#fff;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;
}
.stage{height:100%;display:grid;place-items:center}
.wave{
  width:min(340px,88vw);height:min(480px,84vh);
  border-radius:28px;overflow:hidden;background:#171717;
  box-shadow:0 0 0 1px rgba(255,255,255,.14);
}
.screen{height:100%;background:#171717;padding:28px 24px 88px;color:#fff}
.kicker{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}
h2{margin-top:10px;font-size:34px;font-weight:600;letter-spacing:-.03em}
.amount{margin-top:8px;font-size:28px;font-weight:600;letter-spacing:-.03em}
.who{
  margin-top:22px;padding:16px 18px;border-radius:16px;
  background:rgba(255,255,255,.08);display:flex;flex-direction:column;gap:4px;
}
.who span{color:rgba(255,255,255,.55);font-size:13px}
.go{
  position:absolute;left:18px;right:18px;bottom:18px;height:48px;border:0;border-radius:999px;
  background:#fff;color:#111;font:600 15px/1 system-ui,sans-serif;letter-spacing:-.01em;cursor:pointer;
}
.go.sent{background:#bfe8a8;color:#10190c}
</style>
</head>
<body>
<div id="root"></div>
<!-- DistortionWave from distortion-waves 0.1.0, MIT, Copyright (c) 2026 Jakub Antalik. https://libraries.dev/waves -->
<script src="/ui-lab/distortion-wave/demo.js"></script>
</body>
</html>
