<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Pad</title>

<style>
/* Motion Studies design tokens.
   Single source of truth for color, type, radius and motion.
   Edit here (or in Claude Design) and every component follows. */
:root{
  /* ---------- color ---------- */
  --stage:#000;                         /* page background */
  --card:#171717;                       /* component stage card (= white 9% on black) */
  --surface:#262626;                    /* component body */
  --fill-1:rgba(255,255,255,.05);       /* tiles, fields */
  --fill-2:rgba(255,255,255,.09);       /* chips, badges */
  --fill-3:rgba(255,255,255,.14);       /* tracks, avatars, bars */
  --line:rgba(255,255,255,.12);
  --text:#fff;
  --text-2:rgba(255,255,255,.78);
  --muted:#9a9a9a;
  --muted-2:#828282;
  --chip-text:#b4b4b4;
  --white:#fff;
  --black:#000;
  --green:#bfe8a8;
  --green-text:#c6ecb2;
  --orange:#f2b06b;
  --orange-text:#f2b06b;                /* orange used as text: darker in light */
  --red:#f27c78;
  --yellow:#f0d27c;
  --blue:#8fb6ff;
  --purple:#b9a6f2;
  --pink:#efa3cf;
  --heart:#f2708a;                      /* like, favourite */
  --green-soft:rgba(191,232,168,.14);    /* tinted chip behind green text */
  --on-green:#10190c;                   /* text and checks on --green, same in both themes */
  --object:#2c2c2c;                     /* a free-standing grey object with no card under it: island, goo bubbles */
  --inverse:#fff;                       /* primary pills, thumbs, drops */
  --on-inverse:#000;                    /* content on top of --inverse */
  --rim:transparent;          /* no strokes anywhere */ /* 1px inner edge on surfaces */
  --focus-rim:transparent;
  --glow:rgba(255,255,255,.16);         /* cursor light on tiles */
  --sh:0;                               /* drop shadow strength multiplier; 0 = no shadows anywhere */
  color-scheme:dark;

  /* ---------- type ---------- */
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-2xs:11px;
  --fs-xs:12px;
  --fs-sm:13px;
  --fs-md:14px;
  --fs-base:15px;
  --fs-lg:16px;
  --fs-xl:17px;
  --fw-regular:400;
  --fw-medium:500;
  --fw-bold:600;

  /* ---------- radius ---------- */
  --r-card:28px;
  --r-tile:14px;
  --r-bar:5px;
  --r-pill:999px;
  /* inner radius = outer radius - the padding between them. Usual steps: */
  --r-xs:6px;                           /* keys, tiny chips */
  --r-row:12px;                         /* rows, icon buttons, highlights inside a panel */
  --r-panel:18px;                       /* bars, menus, small panels */
  --r-sheet:24px;                       /* large panels */

  /* ---------- motion: springs are "stiffness damping" ---------- */
  /* Shared presets. A new component starts from these and only adds its own token when it truly needs a different feel. */
  --spring-follow:900 50;      /* something held by the pointer: no overshoot, no lag */
  --spring-settle:280 22;      /* letting go, landing on a value: one small overshoot */
  --spring-soft:260 24;        /* large moves: panels, sheets, the whole component shifting */
  --spring-lead:620 36;        /* stretchy highlight: the edge facing the move */
  --spring-trail:190 19;       /* stretchy highlight: the edge that lags, this makes the stretch */
  --spring-pop:520 16;         /* icon or number pop on select */
  --spring-fade:420 32;        /* opacity and small slides */
  --stagger:45;                /* ms between items entering one after another */
  /* Rubber Dock */
  --dock-lead:640 38;          /* edge of the pill that leads the move */
  --dock-trail:150 16;         /* edge that lags behind: lower = more stretch */
  --dock-drag-lead:1100 56;
  --dock-drag-trail:320 26;
  --dock-open-w:340 21;        /* dock -> card, width */
  --dock-open-h:230 21;        /* dock -> card, height */
  --dock-close:420 30;
  --dock-pop:520 16;           /* icon pop on select */
  --dock-expanded-w:340;       /* px */

  /* Goo Menu */
  --goo-out:230 15;            /* bubbles flying out */
  --goo-in:520 34;             /* bubbles returning */
  --goo-release:300 12;        /* snap back after a drag */
  --goo-toast:260 17;          /* + morphing into the toast pill */
  --goo-radius:112;            /* px, distance of bubbles from + */
  --goo-stagger:45;            /* ms between bubbles */
  --goo-toast-ms:2600;         /* how long the toast stays */
  --goo-blur:10;               /* goo strength: higher = bubbles fuse from further away */

  /* Morph Island */
  --island-w:380 24;           /* width morph */
  --island-h:300 22;           /* height morph, a bit softer so it lands after the width */
  --island-radius:32;          /* px, max corner radius when tall */
  --island-cycle-ms:2800;      /* autoplay step until the viewer interacts */

  /* Hold Button */
  --hold-ms:1200;              /* how long to hold */
  --hold-release:260 14;       /* fill springing back when let go early */
  --hold-morph:320 20;         /* pill <-> circle */
  --hold-done-ms:1700;         /* how long the done state stays */

  /* Jelly Slider */
  --slider-follow:900 50;      /* thumb following the pointer */
  --slider-bubble:420 22;      /* value bubble rising out of the thumb */
  --slider-release:300 14;     /* snap back after over-drag */
  --slider-blur:8;             /* goo strength between thumb and bubble */

  /* Swipe Deck */
  --deck-drag:900 50;          /* top card following the pointer */
  --deck-return:280 16;        /* snapping back when not thrown far enough */
  --deck-threshold:110;        /* px of drag that counts as a decision */

  /* Springy Input */
  --input-caret:700 32;        /* caret travel; it stretches with speed */
  --input-morph:300 20;        /* field <-> success pill */

  /* Pull to Refresh */
  --pull-threshold:88;         /* px of pull that triggers a refresh */
  --pull-return:260 18;        /* list springing back */
  --pull-hold-ms:1300;         /* how long the spinner runs */

  /* Magnetic Tiles */
  --tile-pull:12;              /* px a tile moves toward the cursor */
  --tile-tilt:12;              /* deg of 3D tilt */
  --tile-open:300 24;          /* tile -> card morph */

  /* Glass Lens */
  --lens-follow:180 17;        /* lens chasing the cursor, a little lazy like a drop of water */
  --lens-zoom:1.7;             /* magnification at rest */
  --lens-zoom-press:2.4;       /* magnification while pressed */
  --lens-size:150;             /* px */

  /* Morph Select */
  --select-open:360 24;        /* trigger <-> menu */
  --select-hl:620 34;          /* highlight pill edges (leading edge) */
  --select-reorder:260 21;     /* rows sliding to their new place */

  /* Parallax Ticket */
  --ticket-tilt:14;            /* deg */
  --ticket-depth:12;           /* px of parallax for the front layer */
  --ticket-flip:170 15;        /* flip spring, a little overshoot */

  /* Wheel Picker */
  --wheel-snap:240 24;         /* settling on the nearest value */
  --wheel-decay:5;             /* momentum decay per second: lower = spins longer */

  /* Trends */
  --trend-menu:330 25;         /* "..." button growing into the menu */
  --trend-fly:260 20;          /* the three dots flying into the menu icons */
  --trend-row:300 28;          /* row height: dismiss, undo, show more */
  --trend-live-ms:2200;        /* how often a post count rolls */
  --trend-tick-ms:1100;        /* how often the charts get a new point */
  --trend-expand:280 24;       /* row opening into the big chart */
  --trend-rank:260 22;         /* rows swapping places when the ranking changes */

  /* Side Nav */
  --nav-lead:560 34;           /* hover pill: edge moving toward the new item */
  --nav-trail:220 21;          /* hover pill: edge catching up, this makes it stretch */

  /* Rolling Counter */
  --count-roll:320 24;         /* each digit column rolling to its value: lower damping = more bounce */
  --count-width:380 22;        /* columns growing in and folding away, this stretches the pill */
  --count-press:600 18;        /* button squash, number pop and lean */
  --count-stagger:45;          /* ms each higher column waits, so a carry ripples left */
  --count-blur:1;              /* motion blur strength, 0 = off */
  --count-decay:3.5;           /* fling decay per second: lower = coasts longer */
  --count-snap:260 24;         /* ruler settling on the nearest tick */
  --count-gap:14;              /* ruler: px between ticks */
  --count-fisheye:60;          /* ruler: how much ticks swell near the marker, 0..100 */
  --count-flip:140;            /* split flap: ms per fold */
}

/* ---------- light mode ---------- */
:root[data-theme="light"]{
  --stage:#fff;
  --card:#f7f7f6;
  --surface:#fff;
  --fill-1:rgba(23,24,26,.04);
  --fill-2:rgba(23,24,26,.07);
  --fill-3:rgba(23,24,26,.12);
  --line:rgba(23,24,26,.16);
  --text:#17181a;
  --text-2:#3c3b37;
  --muted:#6f6e68;
  --muted-2:#85847e;
  --chip-text:#5c5b56;
  --green-text:#3f7d2c;
  --orange-text:#a8590c;
  --object:#e6e5e2;
  --inverse:#0e0f11;
  --on-inverse:#f4f3f1;
  --rim:transparent;
  --focus-rim:transparent;
  --glow:rgba(23,24,26,.06);
  --sh:0;
  color-scheme:light;
}

/* ---------- both themes at once ----------
   For a component that shows the dark and the light look side by side (Pull cord:
   the light floods out of the bulb). Same values as the two blocks above, colour only. */
.theme-dark{
  --card:#171717;--surface:#262626;--object:#2c2c2c;
  --fill-1:rgba(255,255,255,.05);--fill-2:rgba(255,255,255,.09);--fill-3:rgba(255,255,255,.14);
  --text:#fff;--text-2:rgba(255,255,255,.78);--muted:#9a9a9a;--muted-2:#828282;
  --inverse:#fff;--on-inverse:#000;color-scheme:dark;
}
.theme-light{
  --card:#f7f7f6;--surface:#fff;--object:#e6e5e2;
  --fill-1:rgba(23,24,26,.04);--fill-2:rgba(23,24,26,.07);--fill-3:rgba(23,24,26,.12);
  --text:#17181a;--text-2:#3c3b37;--muted:#6f6e68;--muted-2:#85847e;
  --inverse:#0e0f11;--on-inverse:#f4f3f1;color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--card);color:var(--text);overflow:hidden;
  font-family:var(--font);-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
.badge{
  position:absolute;left:14px;top:14px;z-index:3;
  font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--text);
  background:var(--fill-2);border-radius:var(--r-pill);padding:4px 10px;
}

/* Avatars and card art: grainy mesh, mixed.
   Three soft spots of colour melt over a main colour, under a fine grain.
   Each family is turned a different way (--p1..3), so the light spot and the deep spot
   never sit in the same corner twice and a row of them does not read as one recipe. */
[data-av]{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),radial-gradient(70% 70% at var(--p1),var(--av-l) 0,transparent 70%),radial-gradient(60% 60% at var(--p2),var(--av-p) 0,transparent 70%),radial-gradient(75% 75% at var(--p3),var(--av-b) 0,transparent 72%),var(--av-a)!important;background-blend-mode:overlay,normal,normal,normal,normal!important}
[data-av="1"]{--av-l:#ffa68f;--av-a:#ff6e3f;--av-b:#ff35f6;--av-p:#ffdcd3;--p1:12.0% 10.0%;--p2:92.0% 8.0%;--p3:88.0% 96.0%}
[data-av="2"]{--av-l:#7f7fff;--av-a:#702bff;--av-b:#f835ff;--av-p:#cecdff;--p1:102.9% 65.6%;--p2:34.6% 107.4%;--p3:-5.9% 29.2%}
[data-av="3"]{--av-l:#5aff5f;--av-a:#2281d3;--av-b:#0a228f;--av-p:#b1ffb0;--p1:65.6% -2.9%;--p2:107.4% 65.4%;--p3:29.2% 105.9%}
[data-av="4"]{--av-l:#ceff66;--av-a:#ffc44a;--av-b:#c3381f;--av-p:#e6ffb8;--p1:34.4% 102.9%;--p2:-7.4% 34.6%;--p3:70.8% -5.9%}
[data-av="5"]{--av-l:#a4ff7a;--av-a:#aaff1f;--av-b:#ffee2e;--av-p:#d9ffbf;--p1:-3.6% 62.9%;--p2:34.6% -7.4%;--p3:108.8% 40.1%}
[data-av="6"]{--av-l:#7daeff;--av-a:#451fff;--av-b:#d23aff;--av-p:#c9dfff;--p1:90.0% 12.0%;--p2:92.0% 92.0%;--p3:4.0% 88.0%}
[data-av="7"]{--av-l:#ffd7d3;--av-a:#ff7bd7;--av-b:#ff8e4f;--av-p:#ffdcf3;--p1:62.9% 103.6%;--p2:-7.4% 65.4%;--p3:40.1% -8.8%}
[data-av="8"]{--av-l:#c2f8ff;--av-a:#2fabe0;--av-b:#0a599a;--av-p:#e2fbff;--p1:37.1% -3.6%;--p2:107.4% 34.6%;--p3:59.9% 108.8%}
[data-av="9"]{--av-l:#e1ffb5;--av-a:#ffff6a;--av-b:#ff8e3f;--av-p:#f9ffd8;--p1:10.0% 88.0%;--p2:8.0% 8.0%;--p3:96.0% 12.0%}
[data-av="10"]{--av-l:#ffa0f5;--av-a:#f33cff;--av-b:#901ab0;--av-p:#ffd2fb;--p1:103.6% 37.1%;--p2:65.4% 107.4%;--p3:-8.8% 59.9%}
[data-av="11"]{--av-l:#97ff86;--av-a:#3ae872;--av-b:#1f8eb8;--av-p:#d0ffc8;--p1:-2.9% 34.4%;--p2:65.4% -7.4%;--p3:105.9% 70.8%}
[data-av="12"]{--av-l:#ffc1a3;--av-a:#ff3c85;--av-b:#ff2cef;--av-p:#ffddd2;--p1:88.0% 90.0%;--p2:8.0% 92.0%;--p3:12.0% 4.0%}

/* Sign Pad: a button that opens into a place to sign, and folds back into proof that you did. */
.box{position:absolute;left:0;top:0;background:var(--surface);overflow:hidden;cursor:pointer;outline:0;will-change:transform,width,height;-webkit-tap-highlight-color:transparent}
.box.sign{cursor:default}
.box:focus-visible{box-shadow:0 0 0 2px var(--muted)}
.ok{position:absolute;inset:0;background:var(--green);opacity:0;pointer-events:none}
.dash{position:absolute;inset:0;border:2px dashed var(--fill-3);border-radius:inherit;opacity:0;pointer-events:none}
.l1,.l2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:var(--fs-lg);font-weight:var(--fw-bold);white-space:nowrap;pointer-events:none;will-change:opacity,transform}
.l1 svg{width:24px;height:24px}
.l2{color:var(--on-green);gap:9px}
.chk{width:24px;height:24px;border-radius:50%;background:var(--on-green);color:var(--green);display:grid;place-items:center;flex:none}
.chk svg{width:14px;height:14px}
.mini{display:block;flex:none}
.ui{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);will-change:opacity}
.hd{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-lg);font-weight:var(--fw-bold);color:var(--muted);pointer-events:none}
.ib{position:absolute;top:12px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.ib svg{width:20px;height:20px}
#rs{left:14px}
#rs svg{will-change:transform}
#cl{right:14px;background:var(--fill-2)}
#cl svg{width:14px;height:14px}
#pad{position:absolute;left:0;top:56px;touch-action:none;cursor:none}
.pen{position:absolute;left:0;top:0;width:26px;height:26px;color:var(--text);pointer-events:none;opacity:0;will-change:transform,opacity}
.fin{position:absolute;left:14px;right:14px;bottom:14px;height:56px;border:0;border-radius:28px;background:var(--fill-2);color:var(--text);font:inherit;font-size:var(--fs-lg);font-weight:var(--fw-bold);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.fin svg{width:24px;height:24px}
.edit{position:absolute;left:0;top:0;width:56px;height:56px;margin:-28px 0 0 -28px;border:0;border-radius:50%;background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;opacity:0;will-change:transform,opacity}
.edit svg{width:22px;height:22px}
.ib:focus-visible,.fin:focus-visible,.edit:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
</style>
</head>
<body>
<div class="box" id="box" role="button" tabindex="0" aria-label="Start signing">
  <i class="ok" id="ok"></i><i class="dash" id="dash"></i>
  <div class="l1" id="l1"><span id="ic1"></span>Start signing</div>
  <div class="l2" id="l2"><span class="chk" id="chk"></span>Signed<canvas class="mini" id="mini"></canvas></div>
  <div class="ui" id="ui" inert>
    <div class="hd">Sign</div>
    <button type="button" class="ib" id="rs" aria-label="Clear"></button>
    <button type="button" class="ib" id="cl" aria-label="Cancel"></button>
    <canvas id="pad" aria-label="Signature area"></canvas>
    <i class="pen" id="pen"></i>
    <button type="button" class="fin" id="fin"><span id="ic2"></span>Finish signing</button>
  </div>
</div>
<button type="button" class="edit" id="edit" aria-label="Edit signature" tabindex="-1"></button>
<script>
// Tiny spring engine shared by every component.
// Springs, sim-time timers (so slow-mo slows them too), one rAF loop, and token readers.
window.Motion = (() => {
  // theme: shared by every page through localStorage, live-updated by the gallery
  const setTheme = t => { document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'; };
  try { setTheme(localStorage.getItem('ms-theme')); } catch { setTheme('dark'); }
  addEventListener('storage', e => { if (e.key === 'ms-theme') setTheme(e.newValue); });

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const S = (x, k = 400, c = 30) => ({ x, v: 0, t: x, k, c });
  const tune = (s, k, c) => { s.k = k; s.c = reduce ? 2 * Math.sqrt(k) : c; };
  const step = (s, dt) => { const a = -s.k * (s.x - s.t) - s.c * s.v; s.v += a * dt; s.x += s.v * dt; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // tokens from shared/tokens.css
  const token = (name, fallback = '') =>
    getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  const num = (name, fallback) => parseFloat(token(name, String(fallback)));
  const spring = (name, fallback) => token(name, fallback).split(/\s+/).map(Number);

  let timeScale = 1;
  const timers = [];
  const after = (sec, fn) => { const t = { t: sec, fn }; timers.push(t); hold(sec); return t; };
  const cancel = t => { const i = timers.indexOf(t); if (i > -1) timers.splice(i, 1); };

  // slow motion, synced with a parent page when embedded
  const slowListeners = [];
  function setSlow(v, fromParent = false) {
    timeScale = v ? .25 : 1;
    slowListeners.forEach(f => f(v));
    if (!fromParent && parent !== window) parent.postMessage({ type: 'motion:slow-changed', on: v }, '*');
  }
  addEventListener('message', e => {
    if (e.data && e.data.type === 'motion:slow') setSlow(!!e.data.on, true);
    if (e.data && e.data.type === 'motion:theme') setTheme(e.data.theme);
  });

  const comps = [];
  let last = performance.now();
  // Lab embedding (?still=1): the study paints one still frame and sleeps. It wakes for real input
  // (pointer, touch, keys, resize) and sleeps again once nothing has moved for a moment. The lab page
  // can also hold it awake ('lab:play') for studies that play by themselves while they are on screen.
  // Opened on its own, it simply runs.
  const labStill = new URLSearchParams(location.search).get('still') === '1';
  let forced = !labStill, awakeUntil = 0, lastInput = 0, lastTouch = -1e9, running = false;
  const awake = () => forced || performance.now() < awakeUntil;
  function kick() { if (running) return; running = true; last = performance.now(); requestAnimationFrame(loop); }
  function wake(ms) { const n = performance.now(); lastInput = lastTouch = n; awakeUntil = Math.max(awakeUntil, n + ms); kick(); }
  // a timer started by a gesture keeps the study awake until it fires, but never for long after the last input
  function hold(sec) { const n = performance.now(); awakeUntil = Math.max(awakeUntil, Math.min(n + sec * 1000 + 600, lastInput + 8000)); }
  ['pointerdown', 'touchstart', 'keydown'].forEach(t => addEventListener(t, () => wake(4000), { passive: true, capture: true }));
  ['pointermove', 'wheel'].forEach(t => addEventListener(t, () => wake(2500), { passive: true, capture: true }));
  addEventListener('resize', () => wake(1500));
  addEventListener('message', e => {
    if (e.data === 'lab:play') { forced = true; kick(); }
    if (e.data === 'lab:stop') forced = false;
  });
  window.__labStop = () => {};   // kept for older call sites: nothing has to be stopped by hand any more
  function loop(now) {
    const on = awake();
    const dt = on ? Math.min((now - last) / 1000, 1 / 30) * timeScale : 0;
    last = now;
    if (on) {
      for (let i = timers.length - 1; i >= 0; i--) {
        if ((timers[i].t -= dt) <= 0) timers.splice(i, 1)[0].fn();
      }
      const sub = 4;
      for (let k = 0; k < sub; k++) comps.forEach(c => c.frame(dt / sub));
    }
    comps.forEach(c => { if (c.render) c.render(); });
    if (on) requestAnimationFrame(loop); else running = false;
  }
  kick();

  // ---- settings from the URL (the lab modal's live controls) ----
  //   ?t.--goo-out=230%2015   sets a CSS token before the study reads it
  //   ?p.melt=1.4             a plain number the study asks for with Motion.param('melt', default)
  //   ?p.lead=620%2036        a spring ("stiffness damping") asked for with Motion.pspring('lead', [620, 36])
  const qp = new URLSearchParams(location.search);
  qp.forEach((v, k) => { if (k.startsWith('t.')) document.documentElement.style.setProperty(k.slice(2), v); });
  const param = (n, d) => { const v = parseFloat(qp.get('p.' + n)); return Number.isFinite(v) ? v : d; };
  const pspring = (n, d) => {
    const a = (qp.get('p.' + n) || '').trim().split(/\s+/).map(Number);
    return a.length === 2 && a.every(Number.isFinite) ? a : d;
  };
  // true while nobody has touched the study for a few seconds: self-playing demos use it to step aside
  const idle = (sec = 5) => performance.now() - lastTouch > sec * 1000;

  return {
    S, tune, step, clamp, token, num, spring, after, cancel, param, pspring, idle,
    register: c => comps.push(c),
    get timeScale() { return timeScale; },
    get slow() { return timeScale !== 1; },
    setSlow, onSlow: f => slowListeners.push(f),
    svg: (p, sw = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`,
  };
})();

</script>
<script>
const fitCanvas = (cv, w, h) => { const d = Math.min(devicePixelRatio || 1, 2); cv.width = Math.round(w * d); cv.height = Math.round(h * d); cv.style.width = w + 'px'; cv.style.height = h + 'px'; const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); return c; };

// Sign Pad
// One box, three shapes: a pill that says start, a card to sign in, and a green pill that says it is done and
// shows a tiny copy of your signature, with an edit button that splits off beside it. The ink is smoothed through
// the midpoints of what you drew, and it gets thinner the faster you move, the way a real pen does. Finishing an
// empty pad shakes the card instead. The demo signs by itself with a generated cursive.
(() => {
  const { S, tune, step, clamp, after, idle, pspring, param, token, svg } = Motion;
  const $ = id => document.getElementById(id);
  const box = $('box'), ok = $('ok'), dash = $('dash'), l1 = $('l1'), l2 = $('l2'), ui = $('ui'), pad = $('pad'), pen = $('pen'), mini = $('mini');
  const rs = $('rs'), cl = $('cl'), fin = $('fin'), edit = $('edit');
  const SIG = '<path d="M3 19c1.5-2.5 2.6-7 4.4-7 1.8 0-.6 6 1.2 6 1.4 0 2.4-2.6 3.4-3.6"/><path d="M13.5 13.5l6.3-6.3a1.9 1.9 0 0 0-2.7-2.7l-6.3 6.3-.7 3.4z"/>';
  const PEN = '<path d="M4 20l1.2-4.4L16.4 4.4a2.1 2.1 0 0 1 3 3L8.2 18.6z"/><path d="M14.5 6.3l3 3"/>';
  $('ic1').innerHTML = svg(SIG, 2); $('ic2').innerHTML = svg(SIG, 2); pen.innerHTML = svg(PEN, 1.9); edit.innerHTML = svg(PEN, 2);
  rs.innerHTML = svg('<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.6h-4.6"/>', 2.2); cl.innerHTML = svg('<path d="M6 6l12 12M18 6L6 18"/>', 2.6);
  $('chk').innerHTML = svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 3);
  const BOX = pspring('box', [260, 24]), INK = param('ink', 3.2), STILL = new URLSearchParams(location.search).get('still') === '1';

  const B = { L: S(0, ...BOX), T: S(0, ...BOX), W: S(0, ...BOX), H: S(0, ...BOX), R: S(28, ...BOX) };
  const F = { l1: S(1), ui: S(0), l2: S(0), ok: S(0, 300, 34), dash: S(0) };
  const E = { x: S(0, 380, 24), s: S(0, 380, 22), o: S(0, 400, 34) }, P = { x: S(0, 900, 55), y: S(0, 900, 55), o: S(0, 400, 34) };
  const SPIN = S(0, 160, 18), SHAKE = S(0, 900, 16), INKA = S(1, 400, 36);
  let state = 'start', W = 0, H = 0, cx = 0, cy = 0, CW = 300, CH = 344, PH = 204, ctx = null, mctx = null;
  let strokes = [], cur = null, dirty = true, hover = false, drawnAlpha = -1, clock = 0, since = 0;
  const DW = 214, DH = 56;

  function layout() {
    W = innerWidth; H = innerHeight; cx = W / 2; cy = H / 2;
    CW = Math.min(300, W - 24); PH = CH - 56 - 84;
    ui.style.width = CW + 'px'; ui.style.height = CH + 'px';
    ctx = fitCanvas(pad, CW, PH); mctx = fitCanvas(mini, 58, 26); dirty = true;
  }
  const doneL = () => cx - (DW + 10 + DH) / 2;
  function place() {
    const r = state === 'sign' ? { l: cx - CW / 2, t: cy - CH / 2, w: CW, h: CH, r: 30 } : state === 'done' ? { l: doneL(), t: cy - DH / 2, w: DW, h: DH, r: DH / 2 } : { l: cx - 98, t: cy - 28, w: 196, h: 56, r: 28 };
    B.L.t = r.l; B.T.t = r.t; B.W.t = r.w; B.H.t = r.h; B.R.t = r.r;
    const ex = doneL() + DW + 10 + DH / 2;
    E.x.t = state === 'done' ? ex : ex - 46; E.s.t = state === 'done' ? 1 : .4; E.o.t = state === 'done' ? 1 : 0;
    F.ok.t = state === 'done' ? 1 : 0;
  }
  // text arrives once the box has nearly taken its new shape; on the way out it leaves at once
  function go(s) {
    if (s === state) return; state = s;
    box.classList.toggle('sign', s === 'sign'); box.setAttribute('aria-label', s === 'start' ? 'Start signing' : s === 'done' ? 'Signed' : 'Signature pad');
    ui.inert = s !== 'sign'; edit.tabIndex = s === 'done' ? 0 : -1; since = clock;
    [F.l1, F.ui, F.l2, F.dash].forEach(f => { tune(f, 1400, 75); f.t = 0; });
    const show = s === 'start' ? [F.l1] : s === 'sign' ? [F.ui, F.dash] : [F.l2];
    after(.14, () => show.forEach(f => { if (state === s) { tune(f, 300, 30); f.t = 1; } }));
    if (s === 'done') drawMini();
    place();
  }

  // ---- ink
  const addPt = (x, y, v) => {
    const last = cur.pts[cur.pts.length - 1];
    if (last && Math.hypot(x - last.x, y - last.y) < .8) return;
    const tw = clamp(INK * 1.3 - v * INK * .0019, INK * .4, INK * 1.3);
    cur.pts.push({ x, y, w: last ? last.w * .6 + tw * .4 : tw * .85 }); dirty = true;
  };
  function ink(c, list, k, ox, oy, color, alpha, wk = k) {
    c.strokeStyle = c.fillStyle = color; c.globalAlpha = alpha; c.lineCap = c.lineJoin = 'round';
    list.forEach(({ pts }) => {
      if (!pts.length) return;
      if (pts.length < 3) { c.beginPath(); c.arc(ox + pts[0].x * k, oy + pts[0].y * k, Math.max(pts[0].w * wk * .6, .8), 0, Math.PI * 2); c.fill(); return; }
      let mx = ox + pts[0].x * k, my = oy + pts[0].y * k;
      for (let i = 1; i < pts.length - 1; i++) {
        const p = pts[i], q = pts[i + 1], nx = ox + (p.x + q.x) / 2 * k, ny = oy + (p.y + q.y) / 2 * k;
        c.beginPath(); c.moveTo(mx, my); c.quadraticCurveTo(ox + p.x * k, oy + p.y * k, nx, ny); c.lineWidth = Math.max(p.w * wk, .7); c.stroke(); mx = nx; my = ny;
      }
    });
    c.globalAlpha = 1;
  }
  function drawMini() {
    mctx.clearRect(0, 0, 58, 26); const all = strokes.flatMap(s => s.pts); if (!all.length) return;
    const xs = all.map(p => p.x), ys = all.map(p => p.y), x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0 || 1, h = Math.max(...ys) - y0 || 1;
    const k = Math.min(54 / w, 22 / h);
    ink(mctx, strokes, k, 29 - (x0 + w / 2) * k, 13 - (y0 + h / 2) * k, token('--on-green', '#10190c'), 1, Math.max(k * 1.5, .5));   // thicker than true scale so it stays legible this small
  }

  // ---- your hand
  const local = e => { const r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  let lastT = 0, lastP = null;
  pad.addEventListener('pointerdown', e => {
    if (state !== 'sign') return; auto = null; pad.setPointerCapture(e.pointerId);
    const [x, y] = local(e); cur = { pts: [] }; strokes.push(cur); lastT = performance.now(); lastP = [x, y]; addPt(x, y, 0);
  });
  pad.addEventListener('pointermove', e => {
    const [x, y] = local(e); hover = true; P.t = x; P.y.t = y; P.x.t = x;
    if (!cur) return; const now = performance.now(), v = Math.hypot(x - lastP[0], y - lastP[1]) / Math.max(now - lastT, 1) * 1000;
    lastT = now; lastP = [x, y]; addPt(x, y, v);
  });
  const up = () => { cur = null; }; pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
  pad.addEventListener('pointerleave', () => { hover = false; });

  function clearInk(animated) {
    auto = null; cur = null;
    if (!animated) { strokes = []; dirty = true; return; }
    SPIN.t -= 360; INKA.t = 0; after(.2, () => { strokes = []; INKA.x = INKA.t = 1; INKA.v = 0; dirty = true; });
  }
  box.addEventListener('click', () => { if (state === 'start') go('sign'); });
  box.addEventListener('keydown', e => { if (state === 'start' && (e.key === 'Enter' || e.key === ' ') && e.target === box) { e.preventDefault(); go('sign'); } });
  rs.addEventListener('click', () => clearInk(true));
  cl.addEventListener('click', () => { go('start'); after(.3, () => clearInk(false)); box.focus({ preventScroll: true }); });
  fin.addEventListener('click', () => { if (!strokes.length) { SHAKE.v += 520; return; } auto = null; go('done'); });
  edit.addEventListener('click', () => go('sign'));
  addEventListener('keydown', e => { if (e.key === 'Escape' && state === 'sign') { go('start'); after(.3, () => clearInk(false)); box.focus({ preventScroll: true }); } });
  addEventListener('resize', () => { layout(); place(); });

  // ---- a generated signature: a tall capital, a run of loops from a prolate trochoid, an underline and a dot
  const cr = (cps, gap = 1.2) => {
    const out = [];
    for (let i = 0; i < cps.length - 1; i++) {
      const p0 = cps[Math.max(i - 1, 0)], p1 = cps[i], p2 = cps[i + 1], p3 = cps[Math.min(i + 2, cps.length - 1)], m = Math.max(1, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / gap));
      for (let j = 0; j < m; j++) {
        const t = j / m, t2 = t * t, t3 = t2 * t, f = (a, b, c, d) => .5 * (2 * b + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (3 * b - a - 3 * c + d) * t3);
        out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    out.push(cps[cps.length - 1]); return out;
  };
  function signature() {
    const loops = [], HS = [46, 15, 40, 17, 24, 19];
    for (let th = 0; th <= Math.PI * 2 * 5.3; th += .05) { const hgt = HS[Math.min(Math.floor(th / (Math.PI * 2)), HS.length - 1)]; loops.push([112 + 4.2 * th + 6.5 * Math.sin(th), 124 - hgt * (1 - Math.cos(th)) / 2]); }
    const slant = list => list.map(([x, y]) => [x + (150 - y) * .22, y]);
    return [
      { pts: slant(cr([[46, 150], [54, 124], [64, 92], [74, 64], [80, 56], [85, 66], [90, 96], [96, 128], [102, 150]])), v: 230 },
      { pts: slant(cr([[60, 118], [80, 113], [100, 114], [112, 122]]).concat(loops)), v: 330 },
      { pts: cr([[66, 172], [120, 166], [190, 156], [252, 144], [270, 139]]), v: 640 },
      { pts: slant([[262, 100], [263.5, 101]]), v: 0 },
    ];
  }
  const fitSig = () => { const k = Math.min(CW / 300, PH / 208); return { k, ox: (CW - 300 * k) / 2, oy: (PH - 208 * k) / 2 - 6 * k }; };
  let auto = null;   // { list, si, pi, wait }
  function startAuto() { strokes = []; dirty = true; auto = { list: signature(), si: 0, pi: 0, wait: 0, fit: fitSig() }; }
  function runAuto(dt) {
    if (!auto) return; if (auto.wait > 0) { auto.wait -= dt; return; }
    const s = auto.list[auto.si], { k, ox, oy } = auto.fit;
    if (auto.pi === 0) { cur = { pts: [] }; strokes.push(cur); }
    let budget = s.v ? s.v * k * dt : 1e9;
    while (auto.pi < s.pts.length && budget > 0) {
      const p = s.pts[auto.pi], q = s.pts[Math.max(auto.pi - 1, 0)], vv = s.v * (.75 + .5 * Math.abs(Math.sin(auto.pi * .045)));
      budget -= Math.hypot(p[0] - q[0], p[1] - q[1]) * k; addPt(ox + p[0] * k, oy + p[1] * k, vv); auto.pi++;
      P.x.t = ox + p[0] * k; P.y.t = oy + p[1] * k;
    }
    if (auto.pi >= s.pts.length) { cur = null; auto.si++; auto.pi = 0; auto.wait = .16; if (auto.si >= auto.list.length) { auto = null; since = clock; } else { const n = auto.list[auto.si].pts[0]; P.x.t = ox + n[0] * k; P.y.t = oy + n[1] * k; } }
  }

  // first frame: a still preview shows the pad already signed, a live one starts as the button
  layout();
  if (STILL) { state = 'sign'; box.classList.add('sign'); ui.inert = false; startAuto(); const a = auto; while (auto) runAuto(1); auto = null; F.l1.t = 0; F.ui.t = F.dash.t = 1; void a; }
  place(); [...Object.values(B), ...Object.values(F), ...Object.values(E)].forEach(s => { s.x = s.t; s.v = 0; });
  P.x.x = P.x.t = CW / 2; P.y.x = P.y.t = PH / 2;

  // the demo: open, sign, finish, admire, start over
  after(1.2, function demo() {
    if (idle(3)) {
      const t = clock - since;
      if (state === 'start' && t > 1.4) { go('sign'); after(.55, () => { if (state === 'sign' && idle(3)) startAuto(); }); }
      else if (state === 'sign' && !auto && strokes.length && t > .8) go('done');
      else if (state === 'done' && t > 2.6) { go('start'); after(.3, () => clearInk(false)); }
    }
    after(.3, demo);
  });

  Motion.register({
    frame(dt) {
      clock += dt; runAuto(dt);
      [...Object.values(B), ...Object.values(F), ...Object.values(E), P.x, P.y, P.o, SPIN, SHAKE, INKA].forEach(s => step(s, dt));
      P.o.t = state === 'sign' && (hover || auto || !strokes.length) ? 1 : 0;
    },
    render() {
      const bw = Math.max(B.W.x, 0), bh = Math.max(B.H.x, 0);
      box.style.transform = `translate(${(B.L.x + SHAKE.x * .03).toFixed(2)}px,${B.T.x.toFixed(2)}px)`;
      box.style.width = bw.toFixed(2) + 'px'; box.style.height = bh.toFixed(2) + 'px'; box.style.borderRadius = Math.min(B.R.x, bh / 2).toFixed(2) + 'px';
      ok.style.opacity = clamp(F.ok.x, 0, 1).toFixed(3); dash.style.opacity = clamp(F.dash.x, 0, 1).toFixed(3);
      const fade = (el, f, dy) => { const v = clamp(f.x, 0, 1); el.style.opacity = v.toFixed(3); if (dy) el.style.transform = `translateY(${((1 - v) * dy).toFixed(2)}px)`; };
      fade(l1, F.l1, 4); fade(l2, F.l2, 4); fade(ui, F.ui, 0);
      edit.style.transform = `translate(${E.x.x.toFixed(2)}px,${cy.toFixed(2)}px) scale(${Math.max(E.s.x, 0).toFixed(3)})`; edit.style.opacity = clamp(E.o.x, 0, 1).toFixed(3);
      rs.firstChild.style.transform = `rotate(${SPIN.x.toFixed(1)}deg)`;
      pen.style.transform = `translate(${(P.x.x - 3).toFixed(2)}px,${(56 + P.y.x - 23).toFixed(2)}px)`; pen.style.opacity = clamp(P.o.x, 0, 1).toFixed(3);
      const a = clamp(INKA.x, 0, 1);
      if (dirty || Math.abs(a - drawnAlpha) > .004) { ctx.clearRect(0, 0, CW, PH); ink(ctx, strokes, 1, 0, 0, token('--text', '#fff'), a); dirty = false; drawnAlpha = a; }
    },
  });
})();
</script>
