<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thinking orbs</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{
  background:#171717;color:#fff;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;
}
.stage{height:100%;display:grid;place-items:center;padding:18px}
.card{
  width:min(300px,92vw);display:flex;flex-direction:column;gap:12px;
}
.pill{
  display:flex;align-items:center;gap:12px;height:72px;padding:0 16px 0 12px;
  border-radius:999px;background:#262626;color:#fff;
  font-size:18px;font-weight:560;letter-spacing:-.02em;
}
.pill canvas{display:block;flex:none}
</style>
</head>
<body>
<div id="root"></div>
<script src="/ui-lab/thinking-orbs/demo.js"></script>
</body>
</html>
