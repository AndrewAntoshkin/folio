  <script>
(function () {
  var cells = [].slice.call(document.querySelectorAll('.lab-cell'));
  function halt(frame) {
    try { if (frame.contentWindow) frame.contentWindow.postMessage('lab:stop', '*'); } catch (e) {}
  }
  function play(frame) {
    cells.forEach(function (cell) {
      var other = cell.querySelector('iframe');
      if (other !== frame) halt(other);
    });
    try { frame.contentWindow.postMessage('lab:play', '*'); } catch (e) {}
  }
  cells.forEach(function (cell, i) {
    var frame = cell.querySelector('iframe');
    var btn = cell.querySelector('.lab-replay');
    var base = frame.getAttribute('src').split('?')[0];
    frame.addEventListener('load', function () {
      frame.dataset.booted = '1';
      if (frame.dataset.want === '1') {
        frame.dataset.want = '';
        play(frame);
      }
    });
    cell.addEventListener('pointerenter', function () {
      if (frame.dataset.played === '1') return;
      frame.dataset.played = '1';
      if (frame.dataset.booted === '1') play(frame);
      else frame.dataset.want = '1';
    });
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      frame.dataset.played = '1';
      frame.dataset.want = '1';
      frame.dataset.booted = '';
      frame.src = base + '?still=1&r=' + Date.now();
    });
  });
})();
</script>
