<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Social — инвесторы и доходность</title>
<link rel="stylesheet" href="kit.css">
<style>
  .stage { background: #3cb4ed; }
  .field { position: absolute; inset: 0; animation: pan 28s ease-in-out infinite alternate; }
  @keyframes pan { from { transform: translate(-24px, 6px); } to { transform: translate(24px, -6px); } }
  .b { position: absolute; width: 198px; height: 198px; margin: -99px 0 0 -99px; border-radius: 50%; background: rgba(255, 255, 255, .2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-top: 4px; color: rgba(255, 255, 255, .88); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; opacity: 0; transform: scale(.4); transition: opacity .4s var(--ease), transform .8s var(--spring), background .6s var(--ease), color .6s var(--ease), box-shadow .6s; }
  .b.in { opacity: 1; transform: scale(1); }
  .b .face { position: relative; width: 88px; height: 88px; border-radius: 36%; background: #d9f0fc; overflow: hidden; transition: width .7s var(--spring), height .7s var(--spring), background .6s; }
  .b .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; }
  .b .r { display: flex; align-items: center; gap: 4px; transition: font-size .6s var(--ease); }
  .b .r svg { width: 14px; height: 14px; stroke-width: 1.8; transition: transform .3s; }
  .b.neg .r { opacity: .72; }
  .b.neg .r svg { transform: scaleY(-1); }
  .b.flash .r { animation: flash .7s var(--ease); }
  @keyframes flash { 35% { transform: scale(1.22); } }

  .b.lead { z-index: 2; color: #16181b; font-size: 18px; font-weight: 700; }
  .b.lead.in { transform: scale(1); }
  .b.lead.grow { animation: grow .9s var(--spring); }
  @keyframes grow { 40% { scale: 1.14; } }
  .b.lead .face { background: rgba(255, 255, 255, .38); }
  .b.l1 { background: #c8f1cf; box-shadow: 0 0 0 2px #b3e9bd inset; }
  .b.l1 .face { width: 107px; height: 107px; }
  .b.l2 { background: #fde8a3; font-size: 22px; }
  .b.l2 .face { width: 122px; height: 122px; }
  .b.l2 .r svg { width: 19px; height: 19px; }
  .b.l3 { background: #dcd1fb; }
  .b.l3 .face { width: 102px; height: 102px; }
</style>
</head>
<body>
<div class="stage" style="--w:1200;--h:700">
  <div class="field" id="field"></div>
</div>
<script src="kit.js"></script>
<script>
(() => {
  const { $, wait } = Kit;
  const U = '/img/open-social/crowd/';
  const AV = [...Array(64)].map((_, i) => i + 1).filter((n) => n !== 9 && n !== 13);
  const O = { x: 359.1, y: 202.9 };
  const UV = { x: 207.2, y: -27.5 };
  const VV = { x: 26.9, y: 202.8 };
  const LEAD_AT = ['0,1', '1,1', '2,1'];

  const slots = [];
  for (let i = -3; i <= 6; i++) {
    for (let j = -2; j <= 4; j++) {
      const x = O.x + i * UV.x + j * VV.x;
      const y = O.y + i * UV.y + j * VV.y;
      if (x > -90 && x < 1290 && y > -90 && y < 790) slots.push({ x, y, key: `${i},${j}` });
    }
  }

  const field = $('#field');
  const make = (s) => {
    const el = document.createElement('div');
    el.className = 'b';
    el.style.cssText = `left:${s.x}px;top:${s.y}px`;
    el.innerHTML = '<div class="face"><img alt=""></div><div class="r"><span>+0%</span></div>';
    field.appendChild(el);
    return { el, img: el.querySelector('img'), num: el.querySelector('span'), v: 0, lead: LEAD_AT.indexOf(s.key) };
  };
  const all = slots.map(make);
  const crowd = all.filter((b) => b.lead < 0);
  const leads = [0, 1, 2].map((k) => all.find((b) => b.lead === k));

  const fmt = (v) => `${v < 0 ? '−' : '+'}${Math.abs(Math.round(v))}%`;
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  function setV(b, v) {
    b.v = v;
    b.num.textContent = fmt(v);
    b.el.classList.toggle('neg', v < 0);
  }
  const countTo = (b, to, dur) => {
    const from = b.v;
    b.v = to;
    return Kit.count(b.num, from, to, dur, fmt).then(() => setV(b, to));
  };

  function reset() {
    const pool = shuffle([...AV]);
    all.forEach((b, i) => {
      b.el.classList.remove('in', 'lead', 'l1', 'l2', 'l3', 'grow');
      b.img.src = `${U}m${pool[i]}.jpg`;
      b.target = Math.random() < 0.18 ? -rnd(1, 9) : rnd(2, 21);
      setV(b, 0);
    });
    const top = [rnd(38, 52), rnd(64, 92), rnd(24, 36)];
    leads.forEach((b, i) => { b.top = top[i]; });
    if (Kit.reduced) {
      all.forEach((b) => { b.el.classList.add('in'); setV(b, b.target); });
      leads.forEach((b, i) => { b.el.classList.add('lead', `l${i + 1}`); setV(b, b.top); });
    }
  }

  async function script() {
    await wait(300);
    for (const b of shuffle([...all])) {
      b.el.classList.add('in');
      countTo(b, b.target, 900);
      await wait(rnd(20, 60));
    }
    await wait(900);
    for (const i of [1, 0, 2]) {
      const b = leads[i];
      b.el.classList.add('lead', `l${i + 1}`, 'grow');
      countTo(b, b.top, 1300);
      await wait(520);
    }
    await wait(2200);
    for (let k = 0; k < 10; k++) {
      const b = crowd[rnd(0, crowd.length - 1)];
      b.el.classList.remove('flash');
      void b.el.offsetWidth;
      b.el.classList.add('flash');
      countTo(b, b.v + (Math.random() < 0.6 ? 1 : -1) * rnd(1, 4), 500);
      if (k % 3 === 2) {
        const l = leads[rnd(0, 2)];
        countTo(l, l.v + rnd(1, 3), 600);
        Kit.bump(l.num.parentNode);
      }
      await wait(rnd(380, 700));
    }
    await wait(1800);
    for (const b of shuffle([...all])) {
      b.el.classList.remove('in');
      await wait(12);
    }
    await wait(800);
  }

  Kit.loop(reset, script);
})();
</script>
</body>
</html>
