<!doctype html>
<html lang="ru">
<head>
  <script>document.documentElement.lang=/[?&]lang=en(?:&|$)/.test(location.search)?"en":"ru"</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Intent OS</title>
  <style>
    @font-face{font-family:GoogleSans;src:url("/assets/fonts/GoogleSans-Latin.woff2") format("woff2");font-weight:100 900;font-display:swap}
    @font-face{font-family:GoogleSans;src:url("/assets/fonts/GoogleSans-Cyrillic.woff2") format("woff2");font-weight:100 900;font-display:swap}
    :root{
      --fog:#dcdcdc;--ink:#2f2f2f;--quiet:rgba(47,47,47,.52);--faint:rgba(47,47,47,.3);--line:rgba(47,47,47,.09);
      --paper:rgba(250,250,250,.94);--head:rgba(240,240,240,.9);--chip:rgba(47,47,47,.055);--rim:rgba(255,255,255,.92);
      --accent:#3f74f0;--accent-soft:rgba(63,116,240,.16);--m-street:#fbfaf7;--m-block:#ebe9e3;--water:#c8dbe7;--park:#d5e4c9;
      --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.2,1.2,.32,1);
      --mw:440px;--mh:560px;--gap:80px;--lx:0px;
    }
    *{box-sizing:border-box}html,body{height:100%;margin:0;overscroll-behavior:none}
    body{overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#e6e6e6,#cdcdcd);color:var(--ink);font:14px/1.45 GoogleSans,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:color .7s var(--ease)}
    body.night{background:radial-gradient(120% 90% at 50% 0%,#1b1b1d,#09090a)}
    /* view-as stage: the OS renders inside one screen; the screen is the size container and the containing block for its overlays */
    .ff-device{position:absolute;left:0;top:0;transform-origin:0 0}
    .ff-screen{position:absolute;inset:0;overflow:clip;contain:layout paint;container:screen/size;background:var(--fog);transition:background .7s var(--ease)}
    .ff-shell{position:absolute;display:none;border-radius:calc(var(--ffr) + var(--ffb));inset:calc(var(--ffb) * -1);background:#0c0c0e;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 100px -30px rgba(0,0,0,.5)}
    html:not(.ff-desktop) .ff-shell{display:block}
    html:not(.ff-desktop) .ff-screen{border-radius:var(--ffr)}
    html.ff-morph .ff-shell{visibility:hidden}
    html.ff-morph .ff-screen{background:transparent!important;transition:none!important}
    html.ff-morph .mist{opacity:0!important;transition:none!important}
    html.ff-morph .ff-screen{overflow:visible!important;contain:none!important}
    html.ff-snap .ff-screen,html.ff-snap .ff-screen *{transition:none!important}
    html.ff-morph #homeLine{position:relative;z-index:8;background-image:linear-gradient(var(--paper),var(--paper))}
    html.ff-morph #space .flow-label{z-index:3}
    html.ff-morph .ph-scrim,html.ff-morph .sys-veil{inset:-2000px}
    .ff-island,.ff-bar{display:none;position:absolute;left:50%;z-index:120;pointer-events:none;transform:translateX(-50%)}
    .ff-phone .ff-island{display:block;top:11px;width:112px;height:32px;border-radius:999px;background:#000}
    .ff-phone .ff-bar{display:block;bottom:8px;width:134px;height:5px;border-radius:999px;background:var(--ink);opacity:.82}
    .ff-bleed .ff-island,.ff-bleed .ff-bar{display:none}
    button,input{font:inherit;color:inherit}button{cursor:pointer}
    ::selection{background:rgba(63,116,240,.2)}
    .ic{display:block;width:15px;height:15px;flex:none}
    .plus,.map-ctl button,.pl-ctl button,.fav,.alarm-time button,.cond button,.mic{display:grid;place-items:center;padding:0}
    .cmd{display:inline-grid;place-items:center;min-width:16px}.cmd .ic{width:16px;height:16px}
    .mist{position:absolute;inset:0;pointer-events:none;background:
      radial-gradient(70% 60% at 14% 92%,rgba(239,198,187,.58),transparent 67%),
      radial-gradient(60% 55% at 53% 102%,rgba(185,209,220,.66),transparent 70%),
      radial-gradient(62% 58% at 90% 88%,rgba(220,215,199,.62),transparent 68%),
      linear-gradient(#e4e4e4,#d8d8d8);transition:opacity .7s var(--ease)}
    .grain{position:absolute;inset:0;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
    .os{position:relative;height:100%}

    .statusbar{position:absolute;inset:0 0 auto;z-index:40;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-size:12px;color:var(--quiet)}
    .statusbar a{color:inherit;text-decoration:none}.statusbar a:hover{color:var(--ink)}
    .sb-left,.sb-right{display:flex;align-items:center;gap:18px}
    .space-title{display:flex;align-items:center;gap:8px;color:var(--ink);opacity:0;transform:translateY(-4px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
    .space-title i{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.7}
    .view-space .space-title{opacity:1;transform:none}
    .collabs{display:flex;padding-left:6px;opacity:0;transition:opacity .5s var(--ease)}.view-space .collabs{opacity:1}
    .cs{position:relative;display:flex;margin-left:-6px}.cs .avatar{margin:0}.collabs:hover .avatar{transform:none}
    .cs:hover{z-index:2}.cs:hover .avatar{transform:translateY(-1px) scale(1.1)}
    .cs:after{content:attr(data-name);position:absolute;top:calc(100% + 8px);left:50%;padding:5px 10px;border-radius:999px;background:var(--ink);color:var(--fog);font-size:11px;line-height:1.2;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-4px) scale(.94);transition:opacity .18s var(--ease),transform .3s var(--spring);z-index:3}
    .cs:hover:after{opacity:1;transform:translate(-50%,0)}
    .avatar{width:24px;height:24px;margin-left:-6px;display:grid;place-items:center;flex:none;border-radius:50%;border:1.5px solid var(--fog);color:#2f2f2f;font-size:9px;font-weight:500;transition:transform .35s var(--spring)}
    .avatar.service{border-radius:7px}
    .avatar.photo{overflow:hidden;background:#d8d8d8}.avatar.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%;pointer-events:none}
    .avatar.svc{border-radius:30%;color:#fff}
    .who-line{display:inline-flex;align-items:center;gap:8px}.who-line .avatar,.who .avatar{margin:0;border:0}
    .avatar.xs{width:18px;height:18px;font-size:7px}.avatar.md{width:28px;height:28px;font-size:10px}
    .who{display:flex;align-items:center;gap:6px}.who.me{justify-content:flex-end}
    .field b.who-line{gap:6px}.avatar.svc .ic{width:58%;height:58%;stroke-width:1.6}.collabs:hover .avatar{transform:translateX(3px)}
    .sb-btn{border:0;background:none;color:inherit;padding:4px 0;transition:color .2s}.sb-btn:hover{color:var(--ink)}
    .lang{display:flex;padding:2px;border:1px solid var(--line);border-radius:8px}
    .lang button{border:0;border-radius:6px;background:none;padding:3px 8px;color:var(--quiet);font-size:11px;transition:background .25s,color .25s}
    .lang button.on{background:rgba(255,255,255,.7);color:var(--ink)}
    .clock{font-variant-numeric:tabular-nums}.clock .tz{margin-left:5px;font-size:9.5px;letter-spacing:.08em;color:var(--faint)}
    .sb-right{position:relative}
    .wx-btn{display:flex;align-items:center;gap:6px;height:28px;margin-right:-8px;padding:0 10px 0 8px;border:0;border-radius:999px;background:transparent;color:var(--quiet);font-size:12px;font-variant-numeric:tabular-nums;transition:background .2s var(--ease),color .2s var(--ease)}
    .wx-btn:hover,.wx-wrap.open .wx-btn{background:var(--chip);color:var(--ink)}.wx-btn:focus-visible{outline:1.5px solid var(--quiet);outline-offset:2px}
    .wx-ico svg{display:block;width:17px;height:17px}
    .wx-pop{position:absolute;top:calc(100% + 10px);right:-6px;width:356px;max-height:calc(100cqh - 76px);overflow-y:auto;scrollbar-width:none;padding:18px 18px 14px;border-radius:20px;color:var(--ink);font-size:12px;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .25s var(--ease),transform .4s var(--ease)}
    .wx-pop::-webkit-scrollbar{display:none}
    .wx-wrap{position:relative}
    .wx-wrap.open .cc{opacity:1;transform:none;pointer-events:auto}
    .wz-top{display:flex;justify-content:space-between;align-items:baseline;color:var(--quiet);font-size:11px}.wz-top b{color:var(--ink);font-size:13px;font-weight:500}
    .wz-now{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-top:10px}
    .wz-now .glyph svg{display:block;width:50px;height:50px}
    .wz-now .glyph .rays{transform-box:fill-box;transform-origin:center;animation:wxspin 40s linear infinite}
    .wz-big{font-size:48px;font-weight:300;letter-spacing:-.045em;line-height:1}
    .wz-cond b{display:block;font-size:13px;font-weight:500}.wz-cond span{display:block;margin-top:2px;color:var(--quiet);font-size:11.5px}
    .wz-hl{max-width:150px;text-align:right;color:var(--quiet);font-size:11.5px;line-height:1.6;font-variant-numeric:tabular-nums}.wz-hl b{color:var(--ink);font-weight:500}
    .wz-sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
    .wz-label{margin-bottom:6px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
    .wz-hours svg{display:block;width:100%;height:auto;overflow:visible}
    .wz-hours text{font-family:inherit;font-variant-numeric:tabular-nums}
    .wz-line{stroke-dasharray:1;stroke-dashoffset:1;animation:wxdraw 1.1s var(--ease) .12s forwards}
    .wz-area{opacity:0;animation:wxfade .8s var(--ease) .45s forwards}
    .wz-day{display:grid;grid-template-columns:64px 20px 30px 28px 1fr 28px;align-items:center;gap:8px;height:30px;font-variant-numeric:tabular-nums}
    .wz-day svg{display:block;width:19px;height:19px}.wz-day .p{color:#4f8fe8;font-size:10.5px}.wz-day .mn{color:var(--quiet);text-align:right}.wz-day .mx{text-align:right}
    .wz-day:first-of-type .d{font-weight:500}
    .wz-range{position:relative;height:5px;border-radius:3px;background:var(--chip)}
    .wz-range i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--c1),var(--c2));transform-origin:left;animation:wxgrow .8s var(--ease) both}
    .wz-range b{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.55)}
    .wz-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .wz-tile{padding:10px 12px;border-radius:12px;background:var(--chip)}
    .wz-tile small{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
    .wz-tile b{display:block;margin-top:4px;font-size:17px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.wz-tile b em{margin-left:3px;font-style:normal;font-size:11px;font-weight:400;color:var(--quiet)}
    .wz-tile span{display:block;margin-top:1px;color:var(--quiet);font-size:11px}
    .wz-meter{position:relative;height:4px;margin-top:8px;border-radius:2px;background:var(--line)}.wz-meter i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--mc,var(--ink));transform-origin:left;animation:wxgrow .8s var(--ease) .2s both}
    .wz-meter.uv{background:linear-gradient(90deg,#6cc070,#f2c94c,#f2994a,#eb5757,#9b51e0)}.wz-meter.uv b{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.55)}
    .wz-sun{grid-column:1/-1;display:grid;grid-template-columns:132px 1fr;align-items:center;gap:14px}
    .wz-sun svg{display:block;width:132px;height:52px;overflow:visible}
    .wz-sun dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:11.5px}.wz-sun dt{color:var(--quiet)}.wz-sun dd{margin:0;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
    .wz-foot{margin-top:12px;color:var(--faint);font-size:10.5px;text-align:center}
    @keyframes wxdraw{to{stroke-dashoffset:0}}@keyframes wxfade{to{opacity:1}}@keyframes wxgrow{from{transform:scaleX(0)}}@keyframes wxspin{to{transform:rotate(360deg)}}
    .me-wrap{position:relative;display:flex}
    .me-btn{width:28px;height:28px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink);font-size:12px;font-weight:500;display:grid;place-items:center;transition:transform .35s var(--spring)}
    .me-btn:hover,.me-wrap.open .me-btn{background:transparent}.me-btn:active{transform:scale(.93)}
    .me-btn .me-photo{width:28px;height:28px}
    .me-photo{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden}
    .me-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:26% 32%}
    .me-photo.letter{display:grid;place-items:center;background:rgba(47,47,47,.08);color:var(--ink);font-weight:500;line-height:1}
    .um-face{width:20px;height:20px;flex:none;display:grid}
    .um-face .me-photo{width:20px;height:20px;font-size:11px}
    .umenu{position:absolute;top:calc(100% + 8px);right:0;width:268px;padding:6px;border-radius:16px;background:var(--paper);border:1px solid var(--rim);box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 60px -22px rgba(0,0,0,.3);color:var(--ink);opacity:0;transform:translateY(-4px);transform-origin:top right;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)}
    .me-wrap.open .umenu{opacity:1;transform:none;pointer-events:auto}
    .um-row{width:100%;display:flex;align-items:center;gap:10px;min-height:36px;padding:0 8px;border:0;border-radius:10px;background:none;color:var(--ink);font-size:13.5px;text-align:left;text-decoration:none;transition:background .2s}
    .um-row:hover,.um-row:focus-visible{background:var(--chip)}
    .um-row:focus-visible{outline:1.5px solid var(--quiet);outline-offset:-2px}
    .um-ic,.um-chev{width:16px;height:16px;flex:none}
    .um-ic{color:var(--ink)}
    .um-chev{margin-left:auto;color:var(--faint)}
    .umenu:has(#notifCount.on) #notifBtn .um-chev{margin-left:8px}
    .um-row > span{flex:1;min-width:0}
    .um-row em{font-style:normal;color:var(--quiet);font-size:12px}
    .um-sep{height:1px;margin:4px 8px;background:var(--line)}

    .home{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-bottom:34px;transition:opacity .6s var(--ease),transform .8s var(--ease),visibility 0s}
    .os:not(.view-home) .home{opacity:0;transform:scale(1.05);visibility:hidden;pointer-events:none;transition:opacity .6s var(--ease),transform .8s var(--ease),visibility 0s .6s}
    .os.view-timeline .home{transform:translateY(-18%)}
    .home-time{font-size:72px;line-height:1;font-weight:300;letter-spacing:-.045em;color:rgba(47,47,47,.6);font-variant-numeric:tabular-nums}
    .home-date{margin-top:-6px;font-size:13px;color:var(--quiet)}
    .home-line{width:min(620px,88cqw);min-height:58px;margin-top:10px;display:flex;align-items:flex-end;gap:10px;padding:12px 14px 12px 22px;border-radius:20px;background:var(--paper);border:1px solid var(--rim);box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 60px -22px rgba(0,0,0,.2);transition:box-shadow .4s var(--ease),transform .4s var(--ease)}
    .home-line:focus-within{box-shadow:0 1px 2px rgba(0,0,0,.05),0 34px 80px -26px rgba(0,0,0,.28)}
    .home-line textarea{flex:1;min-width:0;align-self:stretch;height:32px;max-height:156px;padding:4px 0;margin:0;border:0;outline:0;background:none;font:inherit;font-size:17px;line-height:24px;resize:none;overflow-y:auto;color:inherit;scrollbar-width:thin}
    .home-line textarea::placeholder{color:var(--faint)}
    .home-line .cmd{height:32px;display:grid;place-items:center;align-self:flex-start}
    .send{width:32px;height:32px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:var(--ink);color:var(--paper);opacity:.18;transform:scale(.92);pointer-events:none;transition:opacity .25s var(--ease),transform .4s var(--spring)}
    .send .ic{width:16px;height:16px;stroke-width:1.8}
    .home-line.has-text .send{opacity:1;transform:none;pointer-events:auto}
    .home-line.has-text .send:hover{transform:scale(1.08)}.home-line.has-text .send:active{transform:scale(.92)}
    body.night .send{background:#fff;color:#171717}
    .cmd{color:var(--faint);font-size:13px}
    .kbd{display:inline-block;min-width:18px;padding:1px 5px;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.3);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;box-shadow:0 1px 0 rgba(47,47,47,.12);transition:transform .12s var(--ease),box-shadow .12s var(--ease),background .2s}
    .kbd.pressed{transform:translateY(1px);box-shadow:none;background:#fff}
    /* parsed tokens sit on one row; the 4 live Space cards below stay visible and react to what you type */
    .home-parse{min-height:22px;margin:-4px 0 -2px;width:min(620px,88cqw);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;opacity:0;transition:opacity .25s;position:relative;z-index:1;pointer-events:none}
    .home-parse.show{opacity:1}
    .home:has(.home-line.live-busy) .blueprints,.home:has(.home-line.live-busy) .live-badge,.os:has(>.home-dock .live-busy) .blueprints{opacity:.25;pointer-events:none}
    .blueprints,.live-badge{transition:opacity .3s}
    .tok{flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--quiet);font-size:10.5px;white-space:nowrap;animation:pop .35s var(--spring) backwards}
    .tok b{margin-left:4px;color:var(--ink);font-weight:500}
    @keyframes pop{from{opacity:0;transform:scale(.85)}}
    .blueprints{--sig-2:rgba(0,0,0,.56);display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(704px,90cqw);margin-top:8px}
    body.night .blueprints{--sig-2:rgba(255,255,255,.6)}
    .sig{position:relative;display:block;min-width:0;padding:20px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-edge);border-right-width:0;border-bottom-width:0;box-shadow:var(--glass-shadow);color:var(--ink);text-align:left;cursor:pointer;-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);transition:background-color .16s var(--ease),box-shadow .2s var(--ease),opacity .25s var(--ease),transform .2s var(--ease)}
    .sig:hover,.sig:focus-visible{background:rgba(255,255,255,.76)}
    .sig:active{transform:scale(.98);background:rgba(255,255,255,.86);transition-duration:.08s}
    .sig:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .sig.dim{opacity:.4}
    .sig-top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:18px;margin-bottom:8px;color:var(--sig-2);font-size:13px;line-height:18px}
    .sig-sp{display:flex;align-items:center;gap:8px;min-width:0}
    .sig-sp .ic{width:14px;height:14px;color:var(--sc)}
    .sig-sp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sig-go{display:flex;align-items:center;gap:4px;flex:none;color:var(--accent);opacity:0;transform:translateX(-4px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
    .sig-go .ic{width:14px;height:14px}
    .sig-go .chev{display:none}
    .sig:hover .sig-go,.sig:focus-visible .sig-go{opacity:1;transform:none}
    @media(hover:none){.sig-go{opacity:1;transform:none;color:var(--sig-2)}.sig-go .sig-verb,.sig-go .arrow{display:none}.sig-go .chev{display:block}.sig:hover{background:var(--glass)}}
    .sig-t{display:block;font-size:15px;font-weight:400;line-height:20px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sig-d{margin:4px 0 0;color:var(--sig-2);font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sig-in.swap{animation:sig-swap .24s var(--ease)}
    @keyframes sig-swap{from{opacity:0;transform:translateY(4px)}}
    body.night .sig:hover,body.night .sig:focus-visible{background:rgba(66,66,70,.72)}
    body.night .sig:active{background:rgba(74,74,78,.8)}
    body.night .sig-sp .ic{color:var(--sc-n)}

    /* hint bar sits on glass; give it enough ink to read on the mist */
    .hints{color:rgba(47,47,47,.88);background:rgba(252,252,252,.92);border-color:rgba(47,47,47,.16);font-size:12px}
    .hints .kbd{border-color:rgba(47,47,47,.28);background:rgba(255,255,255,.92);color:rgba(47,47,47,.92);box-shadow:0 1px 0 rgba(47,47,47,.2)}
    body.night .hints{color:rgba(236,236,236,.92);background:rgba(28,28,30,.92);border-color:rgba(255,255,255,.18)}
    body.night .hints .kbd{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.14);color:rgba(236,236,236,.96);box-shadow:none}
    .coach{position:fixed;left:50%;bottom:74px;z-index:45;transform:translateX(-50%);width:min(560px,calc(100cqw - 28px));padding:16px 16px 14px;border-radius:20px;background:rgba(252,252,252,.94);border:1px solid rgba(47,47,47,.12);box-shadow:0 24px 60px -28px rgba(0,0,0,.35);color:var(--ink);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4)}
    .coach b{display:block;margin-bottom:4px;font-size:14px;font-weight:500}
    .coach p{margin:0 0 10px;color:rgba(47,47,47,.78);font-size:12.5px;line-height:1.45}
    .coach .row{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;font-size:12px;color:var(--ink)}
    .coach kbd{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;padding:1px 5px;border:1px solid rgba(47,47,47,.28);border-radius:5px;background:rgba(255,255,255,.9)}

    .coach .acts button{border:0;border-radius:999px;background:var(--ink);color:var(--fog);padding:7px 14px;font-size:12px}
    body.night .coach{background:rgba(32,32,34,.94);border-color:rgba(255,255,255,.14);color:#ececec}
    body.night .coach p{color:rgba(236,236,236,.78)}
    body.night .coach kbd{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#ececec}
    body.night .coach .acts button{background:#fff;color:#171717}

    /* rules as switches with a coloured condition */
    .rule{grid-template-columns:28px 1fr 18px}
    .rule i{position:relative;width:26px;height:16px;margin-top:1px;border:0;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line)}
    .rule i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
    .rule.on i{background:var(--accent);border:0;box-shadow:none}.rule.on i::after{transform:translateX(10px)}
    .rule:not(.on){opacity:.7}
    .rule>span small{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:8px;background:var(--chip);font-size:10.5px}
    .rule.on>span small{background:var(--accent-soft);color:var(--accent)}

    /* collaborators: a stack, then each person with a role */
    .c-stack{display:flex;align-items:center;gap:8px;padding:4px 8px 8px}
    .c-stack .avatar{width:26px;height:26px;margin-left:-8px;border:2px solid var(--fog)}.c-stack .avatar:first-child{margin-left:0}
    .c-stack small{font-size:11px;color:var(--quiet)}
    .collab small.role{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:8px;background:var(--chip);opacity:1}

    /* assembling a space: thinking bar + steps */
    .assembly{position:fixed;inset:0;z-index:80;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .35s var(--ease)}
    .assembly.show{opacity:1;pointer-events:auto;cursor:pointer}

    .asm-card{position:relative;width:min(400px,88cqw);padding:18px 18px 12px;border:1px solid var(--rim);border-radius:20px;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.04),0 34px 80px -26px rgba(0,0,0,.3);transform:translateY(8px) scale(.98);transition:transform .5s var(--spring)}
    .assembly.show .asm-card{transform:none}
    .asm-bar{display:flex;align-items:center;gap:8px;font-size:12px}
    .asm-orb{width:10px;height:10px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),#9ab6ff,var(--accent));animation:asmSpin 1s linear infinite}
    .asm-shim{background:linear-gradient(90deg,var(--quiet) 0%,var(--quiet) 40%,var(--ink) 50%,var(--quiet) 60%,var(--quiet) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:asmShim 1.6s linear infinite}

    .asm-steps li em{font-style:normal;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s}
    .asm-steps li .kt{filter:grayscale(1);opacity:.45;transition:filter .3s,opacity .3s}

    .asm-steps li.run .kt,.asm-steps li.done .kt{filter:none;opacity:1}
    .asm-st{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}

    @keyframes asmSpin{to{transform:rotate(1turn)}}
    @keyframes asmShim{from{background-position:100% 0}to{background-position:-150% 0}}

    /* system windows sit above the desktop and every Space; modules stay in the stream */
    .cs{cursor:pointer;padding:0;border:0;border-radius:50%;background:none}
    .cs:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
    .perm-open{display:flex;align-items:center;gap:8px;width:100%;margin:2px 0 10px;padding:8px;border:0;border-radius:10px;background:var(--accent-soft);color:var(--ink);text-align:left}
    .perm-open span{min-width:0}.perm-open b{display:block;font-weight:500;font-size:12px}.perm-open small{display:block;margin-top:2px;color:var(--quiet);font-size:10.5px;line-height:1.35}
    .perm-open .ic{margin-left:auto;flex:none;color:var(--accent)}
    .perm-open:hover{filter:brightness(.97)}
    body.night .perm-open:hover{filter:brightness(1.08)}
    /* system windows — see DESIGN.md: one 760×560 frame, 200 sidebar, rows are label | control */
    .sys{position:fixed;inset:0;z-index:72;pointer-events:none;
      --s1:rgba(0,0,0,.86);--s2:rgba(0,0,0,.56);--s3:rgba(0,0,0,.5);--s-line:rgba(0,0,0,.06);--s-fill:rgba(0,0,0,.04);--s-fill2:rgba(0,0,0,.08);

      --s-ease:cubic-bezier(.2,.8,.2,1);--s-in:cubic-bezier(.4,0,1,1);--quiet:var(--s2)}

      --s-win:rgba(32,32,34,.9);--s-group:rgba(255,255,255,.05);--s-pop:#2c2c2e;--s-knob:#636366;--s-track:rgba(255,255,255,.08)}
    .sys.on{pointer-events:auto}
    .sys-veil{position:absolute;inset:0;background:rgba(40,40,40,.18);opacity:0;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);transition:opacity .18s var(--s-in),-webkit-backdrop-filter .18s var(--s-in),backdrop-filter .18s var(--s-in)}
    .sys.on .sys-veil{opacity:1;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);transition-duration:.24s;transition-timing-function:var(--s-ease)}
    body.night .sys-veil{background:rgba(0,0,0,.42)}
    .sys-win{position:absolute;left:50%;top:50%;display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:76px minmax(0,1fr);grid-template-areas:"side head" "side body";width:min(760px,calc(100cqw - 48px));height:min(560px,calc(100cqh - 48px));border-radius:20px;background:var(--s-win);border:1px solid var(--s-line);box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 64px -20px rgba(0,0,0,.26),0 64px 120px -48px rgba(0,0,0,.2);color:var(--s1);overflow:hidden;outline:0;opacity:0;transform:translate(-50%,-50%) scale(.96);transition:opacity .28s var(--s-ease),transform .28s var(--s-ease)}
    .sys-win.in{opacity:1;transform:translate(-50%,-50%)}
    .sys-win.in.back{opacity:0;transform:translate(-50%,-50%) scale(.98);pointer-events:none}

    .sys-hl{position:absolute;left:12px;right:12px;top:20px;height:36px;border-radius:10px;background:var(--s-fill2);transform:translateY(calc(var(--k) * 38px));transition:transform .2s var(--s-ease);pointer-events:none}
    .sys-nav{position:relative;display:flex;align-items:center;gap:10px;flex:none;height:36px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--s1);font-size:15px;line-height:20px;text-align:left;white-space:nowrap;transition:background-color .12s,transform .12s var(--s-ease)}
    .sys-nav .ic{width:16px;height:16px;color:var(--s2);transition:color .12s}

    .sys-nav:hover:not(.on){background:var(--s-fill)}

    .sys-head h2{flex:1;min-width:0;margin:0;font-size:26px;font-weight:600;line-height:32px;letter-spacing:-.022em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sys-x{flex:none;width:32px;height:32px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:transparent;color:var(--s2);transition:background-color .12s,color .12s,transform .12s var(--s-ease)}

    button.sys-row{width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:left;transition:background-color .12s}
    button.sys-row:hover{background:var(--s-fill)}
    button.sys-row:active{background:var(--s-fill2)}
    .sys-label{min-width:0;color:var(--s1);font-size:15px;line-height:20px;overflow-wrap:anywhere}

    .sys-label.ico{display:flex;align-items:center;gap:10px}
    .sys-label.ico > .ic{width:18px;height:18px;color:var(--s2)}
    .sys-value{display:flex;align-items:center;gap:6px;min-width:0;color:var(--s2);font-size:15px;line-height:20px;white-space:nowrap}
    .sys-value .ic{width:14px;height:14px}

    .sys-seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:32px;padding:2px;border-radius:9px;background:var(--s-track)}
    .sys-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));border-radius:7px;background:var(--s-knob);box-shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.04);transform:translateX(calc(var(--i) * 100%));transition:transform .16s var(--s-ease);pointer-events:none}
    .sys-seg button{position:relative;min-width:84px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--s2);font-size:13px;line-height:28px;white-space:nowrap;transition:color .16s,background-color .12s,transform .12s var(--s-ease)}

    function applyWeatherSwap(plan){
      const it=allModules().find(x=>x.kind==="checklist"&&/itinerary|маршрут/i.test(x.item||""));
      if(!it)return null;
      const snap=plan?.data?.before||{};
      if(!snap.items){snap.id=it.id;snap.items=it.data.items.map(x=>[...x])}
      const fri=T("Fri · Leo’s workshop, indoors","Пт · Воркшоп с Лео, в помещении");
      const sat=T("Sat · Gulbenkian museum","Сб · Музей Гюльбенкяна");
      if(it.data.items[1])it.data.items[1][0]=fri;
      if(it.data.items[2])it.data.items[2][0]=sat;
      it.data.moved=[1,2];
      refresh(it,false);cardOf(it)?.classList.add("flash");
      const weather=allModules().find(x=>x.kind==="weather");
      if(weather){
        if(!snap.weather)snap.weather={id:weather.id,item:weather.item,cond:weather.data.cond};
        weather.data.cond=T("Rain on Friday · museum moved to Saturday","Дождь в пятницу · музей перенесён на субботу");
        weather.data.settled=true;refresh(weather,false);cardOf(weather)?.classList.add("flash");
      }
      const doc=allModules().find(x=>x.kind==="doc");
      if(doc?.data?.paras?.[1]){
        if(!snap.doc)snap.doc={id:doc.id,para:doc.data.paras[1]};
        doc.data.paras[1]=T("Friday is Leo’s workshop, indoors. The Gulbenkian museum moved to Saturday, when the forecast is clearer.","Пятница — воркшоп с Лео, в помещении. Музей Гюльбенкяна перенесён на субботу, когда прогноз лучше.");
        refresh(doc,false);
      }
      const src=plan&&allModules().find(x=>x.id===plan.data.sourceId);
      if(src&&src.kind==="suggest"){
        if(!snap.suggest)snap.suggest={id:src.id,kind:src.kind,item:src.item,data:JSON.parse(JSON.stringify(src.data))};
        src.kind="summary";src.item=T("Suggestion applied","Предложение учтено");
        src.data={points:T(["Museum moved to Saturday.","Leo’s workshop stays on Friday, indoors.","No further swap is waiting."],["Музей перенесён на субботу.","Воркшоп с Лео остаётся в пятницу, в помещении.","Повторно менять дни не нужно."])};
        refresh(src,false);
      }
      if(plan)plan.data.before=snap;
      tripSwapped=true;
      if(S){S.autoDone=true;clearTimeout(autoTimer)}
      renderSignals();
      profNote("done",{space:S?.id||"trip",svc:"weather",intent:"shift",min:15});
      return it;
    }
    function restoreWeatherSwap(before){
      if(!before)return;
      const it=allModules().find(x=>x.id===before.id);
      if(it&&before.items){it.data.items=before.items.map(x=>[...x]);it.data.moved=null;refresh(it,false)}
      if(before.weather){const w=allModules().find(x=>x.id===before.weather.id);if(w){w.item=before.weather.item;w.data.cond=before.weather.cond;w.data.settled=false;refresh(w,false)}}
      if(before.doc){const d=allModules().find(x=>x.id===before.doc.id);if(d?.data?.paras){d.data.paras[1]=before.doc.para;refresh(d,false)}}
      if(before.suggest){const s=allModules().find(x=>x.id===before.suggest.id);if(s){s.kind=before.suggest.kind;s.item=before.suggest.item;s.data=before.suggest.data;refresh(s,false)}}
      tripSwapped=false;renderSignals();
    }

    function profDayKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
    function profRng(seed){let a=seed>>>0;return ()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
    function buildProfSeed(){
      const totals={trip:168,inbox:66,flat:49,calendar:45,music:33,gym:29,report:20};
      const today=new Date();today.setHours(0,0,0,0);
      const map={};
      const put=(back,id)=>{
        if(!totals[id])return;
        const d=new Date(today);d.setDate(d.getDate()-back);
        const key=profDayKey(d);const cell=map[key]||(map[key]={});
        cell[id]=(cell[id]||0)+1;totals[id]--;
      };
      [["calendar","trip"],["music","inbox"],["calendar","flat"],["music","trip"],["calendar","trip"],["music","gym"],["calendar","report"],["music","trip"],["calendar","inbox"],["music","flat"],["calendar","trip"]].forEach((pair,i)=>pair.forEach(id=>put(i+1,id)));
      const rnd=profRng(20261021);
      Object.keys(totals).forEach(id=>{
        while(totals[id]>0){
          let back=13+Math.floor(rnd()*350);
          if(rnd()<0.22)back=13+Math.floor(rnd()*40);
          put(back,id);
        }
      });
      return map;
    }

    function profSpaces(){const night=document.body.classList.contains("night");const list=USER==="guest"?PROF_SPACES.filter(s=>s.id==="calendar"||s.id==="music"):PROF_SPACES;return list.map(s=>({...s,ink:night&&s.night?s.night:s.color}))}
    function profName(s){return T(s.en,s.ru)}

    function profDays(){
      const today=new Date();today.setHours(0,0,0,0);
      const start=new Date(today);const wd=(start.getDay()+6)%7;start.setDate(start.getDate()-wd-7*51);
      const days=[];

      return days;
    }
    function profStreak(){
      const rulesOn=profRules()>0,today=new Date();today.setHours(0,0,0,0);
      const has=i=>{const d=new Date(today);d.setDate(d.getDate()-i);return Object.values(profBag(d)).some(n=>n>0)};
      const todayOn=has(0)&&rulesOn;
      let cur=0;

      return cur;

    function profTotals(){

      Object.entries(PROF.live).forEach(([k,cell])=>{if(k==="_seen"||!cell||typeof cell!=="object")return;profSpaces().forEach(s=>{totals[s.id]+=cell[s.id]||0})});

    function profTime(min){

    function profInk(hex,value,max){
      if(!value||!max)return "";

    function profHeat(mode,filter){
      const days=profDays(),weeks=[];
      for(let i=0;i<days.length;i+=7)weeks.push(days.slice(i,i+7));
      const bags=days.map(d=>profBag(d));
      const filtered=bags.map(b=>filter&&filter!=="all"?(b[filter]||0):Object.values(b).reduce((a,n)=>a+n,0));
      let run=0;const cumul=filtered.map(n=>run+=n);
      const shown=mode==="cumulative"?cumul:filtered;
      const max=Math.max(1,...(mode==="weekly"?weeks.map(w=>w.reduce((a,d)=>a+((filter&&filter!=="all"?(profBag(d)[filter]||0):Object.values(profBag(d)).reduce((x,n)=>x+n,0))),0)):shown));
      const loc=LANG==="ru"?"ru-RU":"en-GB";
      let lastLabel=-9;
      const months=weeks.map((w,i)=>{
        const first=w[0],prev=i?weeks[i-1][0]:null;
        if((!prev||first.getMonth()!==prev.getMonth())&&i-lastLabel>=4&&i<weeks.length-2){lastLabel=i;return `<span>${esc(first.toLocaleDateString(loc,{month:"short"}).replace(".",""))}</span>`}
        return "<span></span>";
      }).join("");
      const colorOf=d=>{
        const bag=profBag(d);
        if(filter&&filter!=="all")return profSpaces().find(s=>s.id===filter);
        return profDom(bag);
      };
      let cells="";
      if(mode==="weekly"){
        cells=weeks.map(w=>{
          let n=0;const mix={};
          w.forEach(d=>{const b=profBag(d);profSpaces().forEach(s=>{const v=filter&&filter!=="all"?(s.id===filter?b[s.id]||0:0):(b[s.id]||0);n+=v;mix[s.id]=(mix[s.id]||0)+v})});
          const dom=profSpaces().slice().sort((a,b)=>(mix[b.id]||0)-(mix[a.id]||0))[0];
          const ink=n&&dom?profInk(dom.ink,n,max):"";
          const label=w[0].toLocaleDateString(loc,{day:"numeric",month:"short"});
          const who=n&&dom?profName(dom):"";
          return `<i class="${n?"":"empty"}" style="${ink?`background:${ink}`:""}" title="${esc(who?`${label} · ${who} · ${n}`:`${label}`)}"></i>`;
        }).join("");
      }else{
        days.forEach((d,i)=>{
          const n=mode==="cumulative"?cumul[i]:filtered[i];
          const dom=colorOf(d);
          const ink=n&&dom?profInk(dom.ink,n,max):"";
          const label=d.toLocaleDateString(loc,{weekday:"short",day:"numeric",month:"short"});
          const who=dom&&n?profName(dom):"";
          cells+=`<i class="${n?"":"empty"}" style="${ink?`background:${ink}`:""}" title="${esc(who?`${label} · ${who} · ${n}`:label)}"></i>`;
        });
      }
      return `<div class="hm-scroll"><div class="hm"><div class="hm-months">${months}</div><div class="hm-grid${mode==="weekly"?" weeks":""}">${cells}</div></div></div>`;
    }
    function profTop(){

    $("#switcher")?.addEventListener("click",e=>{
      const pin=e.target.closest("[data-pin]"),x=e.target.closest("[data-close]"),card=e.target.closest("[data-open]");
      if(pin){const sp=OPEN.get(pin.dataset.pin);if(sp){sp.pinned=!sp.pinned;renderSwitcher()}return}
      if(x){closeSpaceId(x.dataset.close);return}
      if(card)openFromSwitcher(card.dataset.open);
    });
    $("#cc")?.addEventListener("pointerdown",e=>{
      const t=e.target.closest("[data-cc]");if(!t||e.button!==0)return;
      const id=t.dataset.cc;let held=false;
      const timer=setTimeout(()=>{held=true;CC.expand=CC.expand===id?null:id;renderCC()},420);
      const up=()=>{clearTimeout(timer);removeEventListener("pointerup",up);if(!held)toggleTile(id)};
      addEventListener("pointerup",up);
    });
    $("#cc")?.addEventListener("contextmenu",e=>{const t=e.target.closest("[data-cc]");if(!t)return;e.preventDefault();CC.expand=t.dataset.cc;renderCC()});
    $("#cc")?.addEventListener("input",e=>{
      if(e.target.id==="ccBright"){CC.bright=+e.target.value/100;applyBright();const sm=e.target.closest(".cc")?.querySelector('[data-cc="bright"] small');if(sm)sm.textContent=Math.round(CC.bright*100)+"%";return}
      const room=e.target.closest("[data-room]");if(room){CC.rooms[room.dataset.room]=room.checked;CC.lights=CC.rooms.living||CC.rooms.kitchen;return}
      const rule=e.target.closest("[data-rule-cc]");if(rule&&S){S.rules[+rule.dataset.ruleCc].on=rule.checked;applyRules()}
    });
    $("#ffSwitch").addEventListener("click",e=>{const b=e.target.closest("[data-dev]");if(!b||performance.now()-justDrop<600)return;setDevice(b.dataset.dev)});
    $("#ffSwitch").addEventListener("keydown",e=>{
      const dir={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(!dir)return;
      e.preventDefault();e.stopPropagation();
      const i=(DEVICES.findIndex(d=>d.id===FF.dev)+dir+DEVICES.length)%DEVICES.length;
      setDevice(DEVICES[i].id);$(`#ffSwitch [data-dev="${DEVICES[i].id}"]`)?.focus();
    });
    addEventListener("keydown",e=>{
      if(e.metaKey||e.ctrlKey||e.altKey||e.repeat||e.isComposing)return;
      const i="12".indexOf(e.key);if(i<0||e.key.length!==1)return;
      const t=e.target,typing=t.matches?.("input,textarea,select")||t.isContentEditable;
      if(typing&&!(isTypeField(t)&&!t.value))return;
      if(document.body.classList.contains("locked"))return;
      e.preventDefault();e.stopImmediatePropagation();setDevice(DEVICES[i].id);
    },true);
    $("#stack")?.addEventListener("click",e=>{
      const a=e.target.closest("[data-ca]");if(a){e.stopPropagation();const m=findModuleById(a.dataset.ca);if(m)rep(m).acts[0]?.run();proj();return}
      const c=e.target.closest("[data-cid]");if(c)openFull(findModuleById(c.dataset.cid));
    });
    $("#stack")?.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".cp")){e.preventDefault();openFull(findModuleById(e.target.dataset.cid))}});
    $("#homeSpaces")?.addEventListener("click",e=>{const b=e.target.closest("[data-hs]");if(b)enterSpace(b.dataset.hs)});
    $("#phScrim")?.addEventListener("click",()=>setSheet(false));
    /* sheet detents: large (56px from the top) and medium (46%); between them the sheet resizes, so its actions stay pinned to the bottom;
       below medium it slides and dismisses on distance or a flick; a tap (or Enter/Space) on the grabber switches detents */
    const shDetents=sp=>({big:56,mid:Math.round(sp.offsetParent.clientHeight*.46)});
    const shToggle=()=>{if(document.documentElement.classList.contains("ph-sheet"))document.documentElement.classList.toggle("ph-mid")};
    $("#shGrip")?.addEventListener("pointerdown",e=>{
      if(e.button!==0)return;
      const sp=$("#space"),h=document.documentElement,{big,mid}=shDetents(sp),t0=h.classList.contains("ph-mid")?mid:big,y0=e.clientY;
      let t=t0,v=0,ly=e.clientY,lt=e.timeStamp;
      h.classList.add("ph-drag");
      const mv=ev=>{
        t=t0+(ev.clientY-y0)/FF.s;
        const dt=ev.timeStamp-lt;if(dt>0){v=.7*((ev.clientY-ly)/FF.s/dt)+.3*v;ly=ev.clientY;lt=ev.timeStamp}
        sp.style.top=(t<big?big-(big-t)/4:Math.min(t,mid))+"px";sp.style.setProperty("--sh-dy",Math.max(0,t-mid)+"px");
      };
      const up=()=>{
        removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);
        h.classList.remove("ph-drag");sp.style.removeProperty("top");
        if(Math.abs(t-t0)<4){sp.style.removeProperty("--sh-dy");shToggle();return}
        const end=t+v*160;
        if(t>mid&&(end>mid+120||v>.6)){h.classList.add("ph-mid");setSheet(false);return}
        sp.style.removeProperty("--sh-dy");
        h.classList.toggle("ph-mid",Math.abs(end-mid)<Math.abs(end-big));
      };
      addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up);
    });
    $("#shGrip")?.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();shToggle()}});
    $("#homeGrab")?.addEventListener("pointerdown",e=>{const y0=e.clientY,up=ev=>{removeEventListener("pointerup",up);const d=y0-ev.clientY;if(d>24||Math.abs(d)<6)openSwitcher()};addEventListener("pointerup",up)});
    $("#space")?.addEventListener("pointerdown",e=>{
      const tile=e.target.closest(".module .m-head .kt");
      if(!tile||e.button!==0||overviewOpen)return;
      const card=tile.closest(".module");
      e.preventDefault();
      modDrag={id:card.dataset.id,x:e.clientX,y:e.clientY,pid:e.pointerId,on:false,title:card.querySelector(".line-in")?.placeholder||""};
    });
    addEventListener("pointermove",e=>{
      if(!modDrag||e.pointerId!==modDrag.pid)return;
      if(!modDrag.on&&Math.hypot(e.clientX-modDrag.x,e.clientY-modDrag.y)<6)return;
      if(!modDrag.on){modDrag.on=true;document.body.classList.add("mod-drag");const g=$("#dragGhost");g.hidden=false;g.textContent=modDrag.title;renderFFSwitch()}
      const g=$("#dragGhost");g.style.left=(e.clientX+12)+"px";g.style.top=(e.clientY+12)+"px";
      const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest?.("[data-dev]");
      const next=hit?.dataset.dev||null;
      if(next!==hotDev){hotDev=next;renderFFSwitch()}
    });
    addEventListener("pointerup",e=>{
      if(!modDrag||e.pointerId!==modDrag.pid)return;
      const d=modDrag;modDrag=null;document.body.classList.remove("mod-drag");const g=$("#dragGhost");if(g)g.hidden=true;
      const hit=d.on?document.elementFromPoint(e.clientX,e.clientY)?.closest?.("[data-dev]"):null;
      hotDev=null;renderFFSwitch();
      if(hit){const loc=findModule(d.id);if(loc)beginHandoff(hit.dataset.dev,loc.m)}
    });
    addEventListener("pointercancel",e=>{if(!modDrag||e.pointerId!==modDrag.pid)return;modDrag=null;hotDev=null;document.body.classList.remove("mod-drag");$("#dragGhost").hidden=true;renderFFSwitch()});
    addEventListener("pointerdown",poke,{passive:true});
    let pokeMv=0;addEventListener("pointermove",()=>{const t=performance.now();if(t-pokeMv>500){pokeMv=t;poke()}},{passive:true});
    addEventListener("keydown",poke);
    $("#idle")?.addEventListener("pointerdown",e=>{e.stopPropagation();wake()});
    armIdle();
    renderUser();renderFocus();

    applyDevice(devOf(params.get("device"))?params.get("device"):"desktop");
    applyLang();
    T("Wake me at 7:30 unless it snows","Разбуди меня в 7:30, если не будет снега");
    T("unless it snows","если не будет снега");
    const qs=params.get("space");
    if(qs&&BP[qs])openSpace(BP[qs]());
    else if(params.get("view")==="timeline")setView("timeline");
    else{setTimeout(()=>$("#intentInput").focus(),200);staggerIn($$(".home-time,.home-date,.home-line,.blueprints,.home-apps,.timeline-hint"),18,70);showCoach()}
  </script>
  <script src="/demos/intent-os/live.js"></script>
</body>
</html>
