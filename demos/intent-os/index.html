<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Intent OS</title>
  <style>
    @font-face{font-family:GoogleSans;src:url("/assets/fonts/GoogleSans-Latin.woff2") format("woff2");font-weight:100 900;font-display:swap}
    @font-face{font-family:GoogleSans;src:url("/assets/fonts/GoogleSans-Cyrillic.woff2") format("woff2");font-weight:100 900;font-display:swap}
    :root{
      --fog:#dcdcdc;--ink:#2f2f2f;--quiet:rgba(47,47,47,.52);--faint:rgba(47,47,47,.3);--line:rgba(47,47,47,.09);
      --paper:rgba(250,250,250,.94);--head:rgba(240,240,240,.9);--chip:rgba(47,47,47,.055);--rim:rgba(255,255,255,.92);
      --accent:#3f74f0;--accent-soft:rgba(63,116,240,.16);--m-street:#fbfaf7;--m-block:#ebe9e3;--water:#c8dbe7;--park:#d5e4c9;
      --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.2,1.2,.32,1);
      --mw:440px;--mh:560px;--gap:80px;--lx:0px;
    }
    *{box-sizing:border-box}html,body{height:100%;margin:0;overscroll-behavior:none}
    body{overflow:hidden;background:var(--fog);color:var(--ink);font:14px/1.45 GoogleSans,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .7s var(--ease),color .7s var(--ease)}
    button,input{font:inherit;color:inherit}button{cursor:pointer}
    ::selection{background:rgba(63,116,240,.2)}
    .ic{display:block;width:15px;height:15px;flex:none}
    .plus,.map-ctl button,.pl-ctl button,.fav,.alarm-time button,.cond button,.mic{display:grid;place-items:center;padding:0}
    .cmd{display:inline-grid;place-items:center;min-width:16px}.cmd .ic{width:16px;height:16px}
    .mist{position:fixed;inset:0;pointer-events:none;background:
      radial-gradient(70% 60% at 14% 92%,rgba(239,198,187,.58),transparent 67%),
      radial-gradient(60% 55% at 53% 102%,rgba(185,209,220,.66),transparent 70%),
      radial-gradient(62% 58% at 90% 88%,rgba(220,215,199,.62),transparent 68%),
      linear-gradient(#e4e4e4,#d8d8d8);transition:opacity .7s var(--ease)}
    .grain{position:fixed;inset:0;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
    .os{position:relative;height:100%}

    .statusbar{position:absolute;inset:0 0 auto;z-index:40;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-size:12px;color:var(--quiet)}
    .statusbar a{color:inherit;text-decoration:none}.statusbar a:hover{color:var(--ink)}
    .sb-left,.sb-right{display:flex;align-items:center;gap:18px}
    .space-title{display:flex;align-items:center;gap:8px;color:var(--ink);opacity:0;transform:translateY(-4px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
    .space-title i{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.7}
    .view-space .space-title{opacity:1;transform:none}
    .collabs{display:flex;padding-left:6px;opacity:0;transition:opacity .5s var(--ease)}.view-space .collabs{opacity:1}
    .cs{position:relative;display:flex;margin-left:-6px}.cs .avatar{margin:0}.collabs:hover .avatar{transform:none}
    .cs:hover{z-index:2}.cs:hover .avatar{transform:translateY(-1px) scale(1.1)}
    .cs:after{content:attr(data-name);position:absolute;top:calc(100% + 8px);left:50%;padding:5px 10px;border-radius:999px;background:var(--ink);color:var(--fog);font-size:11px;line-height:1.2;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-4px) scale(.94);transition:opacity .18s var(--ease),transform .3s var(--spring);z-index:3}
    .cs:hover:after{opacity:1;transform:translate(-50%,0)}
    .avatar{width:24px;height:24px;margin-left:-6px;display:grid;place-items:center;flex:none;border-radius:50%;border:1.5px solid var(--fog);color:#2f2f2f;font-size:9px;font-weight:500;transition:transform .35s var(--spring)}
    .avatar.service{border-radius:7px}
    .avatar.photo{overflow:hidden;background:#d8d8d8}.avatar.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%;pointer-events:none}
    .avatar.svc{border-radius:30%;color:#fff}
    .who-line{display:inline-flex;align-items:center;gap:8px}.who-line .avatar,.who .avatar{margin:0;border:0}
    .avatar.xs{width:18px;height:18px;font-size:7px}.avatar.md{width:28px;height:28px;font-size:10px}
    .who{display:flex;align-items:center;gap:6px}.who.me{justify-content:flex-end}
    .field b.who-line{gap:6px}.avatar.svc .ic{width:58%;height:58%;stroke-width:1.6}.collabs:hover .avatar{transform:translateX(3px)}
    .sb-btn{border:0;background:none;color:inherit;padding:4px 0;transition:color .2s}.sb-btn:hover{color:var(--ink)}
    .lang{display:flex;padding:2px;border:1px solid var(--line);border-radius:8px}
    .lang button{border:0;border-radius:6px;background:none;padding:3px 8px;color:var(--quiet);font-size:11px;transition:background .25s,color .25s}
    .lang button.on{background:rgba(255,255,255,.7);color:var(--ink)}
    .clock{font-variant-numeric:tabular-nums}.clock .tz{margin-left:5px;font-size:9.5px;letter-spacing:.08em;color:var(--faint)}
    .sb-right{position:relative}
    .wx-btn{display:flex;align-items:center;gap:6px;height:28px;margin-right:-8px;padding:0 10px 0 8px;border:0;border-radius:999px;background:transparent;color:var(--quiet);font-size:12px;font-variant-numeric:tabular-nums;transition:background .2s,color .2s,transform .35s var(--spring)}
    .wx-btn:hover,.wx-wrap.open .wx-btn{background:var(--chip);color:var(--ink)}.wx-btn:active{transform:scale(.95)}.wx-btn:focus-visible{outline:1.5px solid var(--quiet);outline-offset:2px}
    .wx-ico svg{display:block;width:17px;height:17px}
    .wx-pop{position:absolute;top:calc(100% + 10px);right:-6px;width:356px;max-height:calc(100vh - 76px);overflow-y:auto;scrollbar-width:none;padding:18px 18px 14px;border-radius:20px;color:var(--ink);font-size:12px;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .25s var(--ease),transform .4s var(--ease)}
    .wx-pop::-webkit-scrollbar{display:none}
    .wx-wrap.open .wx-pop{opacity:1;transform:none;pointer-events:auto}
    .wz-top{display:flex;justify-content:space-between;align-items:baseline;color:var(--quiet);font-size:11px}.wz-top b{color:var(--ink);font-size:13px;font-weight:500}
    .wz-now{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-top:10px}
    .wz-now .glyph svg{display:block;width:50px;height:50px}
    .wz-now .glyph .rays{transform-box:fill-box;transform-origin:center;animation:wxspin 40s linear infinite}
    .wz-big{font-size:48px;font-weight:300;letter-spacing:-.045em;line-height:1}
    .wz-cond b{display:block;font-size:13px;font-weight:500}.wz-cond span{display:block;margin-top:2px;color:var(--quiet);font-size:11.5px}
    .wz-hl{max-width:150px;text-align:right;color:var(--quiet);font-size:11.5px;line-height:1.6;font-variant-numeric:tabular-nums}.wz-hl b{color:var(--ink);font-weight:500}
    .wz-sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
    .wz-label{margin-bottom:6px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
    .wz-hours svg{display:block;width:100%;height:auto;overflow:visible}
    .wz-hours text{font-family:inherit;font-variant-numeric:tabular-nums}
    .wz-line{stroke-dasharray:1;stroke-dashoffset:1;animation:wxdraw 1.1s var(--ease) .12s forwards}
    .wz-area{opacity:0;animation:wxfade .8s var(--ease) .45s forwards}
    .wz-day{display:grid;grid-template-columns:64px 20px 30px 28px 1fr 28px;align-items:center;gap:8px;height:30px;font-variant-numeric:tabular-nums}
    .wz-day svg{display:block;width:19px;height:19px}.wz-day .p{color:#4f8fe8;font-size:10.5px}.wz-day .mn{color:var(--quiet);text-align:right}.wz-day .mx{text-align:right}
    .wz-day:first-of-type .d{font-weight:500}
    .wz-range{position:relative;height:5px;border-radius:3px;background:var(--chip)}
    .wz-range i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--c1),var(--c2));transform-origin:left;animation:wxgrow .8s var(--ease) both}
    .wz-range b{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.55)}
    .wz-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .wz-tile{padding:10px 12px;border-radius:12px;background:var(--chip)}
    .wz-tile small{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
    .wz-tile b{display:block;margin-top:4px;font-size:17px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.wz-tile b em{margin-left:3px;font-style:normal;font-size:11px;font-weight:400;color:var(--quiet)}
    .wz-tile span{display:block;margin-top:1px;color:var(--quiet);font-size:11px}
    .wz-meter{position:relative;height:4px;margin-top:8px;border-radius:2px;background:var(--line)}.wz-meter i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--mc,var(--ink));transform-origin:left;animation:wxgrow .8s var(--ease) .2s both}
    .wz-meter.uv{background:linear-gradient(90deg,#6cc070,#f2c94c,#f2994a,#eb5757,#9b51e0)}.wz-meter.uv b{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.55)}
    .wz-sun{grid-column:1/-1;display:grid;grid-template-columns:132px 1fr;align-items:center;gap:14px}
    .wz-sun svg{display:block;width:132px;height:52px;overflow:visible}
    .wz-sun dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:11.5px}.wz-sun dt{color:var(--quiet)}.wz-sun dd{margin:0;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
    .wz-foot{margin-top:12px;color:var(--faint);font-size:10.5px;text-align:center}
    @keyframes wxdraw{to{stroke-dashoffset:0}}@keyframes wxfade{to{opacity:1}}@keyframes wxgrow{from{transform:scaleX(0)}}@keyframes wxspin{to{transform:rotate(360deg)}}
    .me-wrap{position:relative;display:flex}
    .me-btn{width:28px;height:28px;padding:0;border:0;border-radius:50%;background:var(--chip);color:var(--ink);font-size:11px;font-weight:500;display:grid;place-items:center;transition:background .2s,transform .35s var(--spring)}
    .me-btn:hover,.me-wrap.open .me-btn{background:rgba(47,47,47,.12)}.me-btn:active{transform:scale(.93)}
    .umenu{position:absolute;top:calc(100% + 10px);right:0;width:232px;padding:6px;border-radius:20px;background:var(--paper);border:1px solid var(--rim);box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 60px -22px rgba(0,0,0,.3);color:var(--ink);opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .25s var(--ease),transform .4s var(--ease)}
    .me-wrap.open .umenu{opacity:1;transform:none;pointer-events:auto}
    .um-head{display:flex;align-items:center;gap:10px;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
    .um-head .me-btn{width:32px;height:32px;pointer-events:none}
    .um-head b{display:block;font-weight:500;font-size:13px}.um-head div span{display:block;margin-top:1px;color:var(--quiet);font-size:11px}
    .um-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--ink);font-size:12.5px;text-align:left;text-decoration:none;transition:background .2s}
    .um-row:hover{background:var(--chip)}
    .um-row .lang{margin:-2px -4px -2px 0}
    .um-row em{font-style:normal;color:var(--quiet);font-size:11.5px}
    .um-sep{height:1px;margin:4px 6px;background:var(--line)}

    .home{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-bottom:34px;transition:opacity .6s var(--ease),transform .8s var(--ease),visibility 0s}
    .os:not(.view-home) .home{opacity:0;transform:scale(1.05);visibility:hidden;pointer-events:none;transition:opacity .6s var(--ease),transform .8s var(--ease),visibility 0s .6s}
    .os.view-timeline .home{transform:translateY(-18%)}
    .home-time{font-size:72px;line-height:1;font-weight:300;letter-spacing:-.045em;color:rgba(47,47,47,.6);font-variant-numeric:tabular-nums}
    .home-date{margin-top:-6px;font-size:13px;color:var(--quiet)}
    .home-line{width:min(620px,88vw);min-height:58px;margin-top:10px;display:flex;align-items:flex-end;gap:10px;padding:12px 14px 12px 22px;border-radius:20px;background:var(--paper);border:1px solid var(--rim);box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 60px -22px rgba(0,0,0,.2);transition:box-shadow .4s var(--ease),transform .4s var(--ease)}
    .home-line:focus-within{transform:translateY(-2px);box-shadow:0 1px 2px rgba(0,0,0,.05),0 34px 80px -26px rgba(0,0,0,.28)}
    .home-line textarea{flex:1;min-width:0;align-self:stretch;height:32px;max-height:156px;padding:4px 0;margin:0;border:0;outline:0;background:none;font:inherit;font-size:17px;line-height:24px;resize:none;overflow-y:auto;color:inherit;scrollbar-width:thin}
    .home-line textarea::placeholder{color:var(--faint)}
    .home-line .cmd{height:32px;display:grid;place-items:center;align-self:flex-start}
    .send{width:32px;height:32px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:var(--ink);color:var(--paper);opacity:.18;transform:scale(.92);pointer-events:none;transition:opacity .25s var(--ease),transform .4s var(--spring)}
    .send .ic{width:16px;height:16px;stroke-width:1.8}
    .home-line.has-text .send{opacity:1;transform:none;pointer-events:auto}
    .home-line.has-text .send:hover{transform:scale(1.08)}.home-line.has-text .send:active{transform:scale(.92)}
    body.night .send{background:#fff;color:#171717}
    .cmd{color:var(--faint);font-size:13px}
    .kbd{display:inline-block;min-width:18px;padding:1px 5px;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.3);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;box-shadow:0 1px 0 rgba(47,47,47,.12);transition:transform .12s var(--ease),box-shadow .12s var(--ease),background .2s}
    .kbd.pressed{transform:translateY(1px);box-shadow:none;background:#fff}
    /* parsed tokens sit on one row; the 4 live Space cards below stay visible and react to what you type */
    .home-parse{min-height:22px;margin:-4px 0 -2px;width:min(620px,88vw);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;opacity:0;transition:opacity .25s;position:relative;z-index:1;pointer-events:none}
    .home-parse.show{opacity:1}
    .home:has(.home-line.live-busy) .blueprints,.home:has(.home-line.live-busy) .live-badge{opacity:.25;pointer-events:none}
    .blueprints,.live-badge{transition:opacity .3s}
    .tok{flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--quiet);font-size:10.5px;white-space:nowrap;animation:pop .35s var(--spring) both}
    .tok b{margin-left:4px;color:var(--ink);font-weight:500}
    @keyframes pop{from{opacity:0;transform:scale(.85)}}
    .blueprints{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(648px,90vw)}
    .sig{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:7px;min-height:112px;padding:12px 14px 11px;border:1px solid var(--rim);border-radius:20px;background:rgba(250,250,250,.52);box-shadow:0 1px 2px rgba(0,0,0,.03),0 16px 36px -22px rgba(0,0,0,.15);color:var(--ink);text-align:left;cursor:pointer;overflow:hidden;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:background .3s var(--ease),transform .45s var(--spring),box-shadow .35s var(--ease),border-color .3s,opacity .3s}
    .sig:hover{background:var(--paper);transform:translateY(-2px);box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 50px -22px rgba(0,0,0,.22)}
    .sig:active{transform:scale(.985);transition-duration:.1s}
    .sig.pulse{border-color:rgba(63,116,240,.38);box-shadow:0 0 0 3px var(--accent-soft),0 20px 44px -22px rgba(0,0,0,.2)}
    .sig.match{border-color:var(--accent);background:var(--paper);box-shadow:0 0 0 3px var(--accent-soft),0 22px 48px -20px rgba(0,0,0,.24);transform:translateY(-2px)}
    .sig.dim{opacity:.42;transform:scale(.985)}
    .sig-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--quiet)}
    .sig-who{display:inline-flex;align-items:center;gap:6px;min-width:0}
    .sig-avs{display:inline-flex;align-items:center}.sig-avs .avatar{margin:0;width:18px;height:18px;font-size:7px;border:1.5px solid rgba(250,250,250,.85)}.sig-avs .avatar+.avatar{margin-left:-5px}
    .sig-space{font-weight:500;color:var(--ink);opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sig-rule{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:999px;background:var(--chip);font-size:10px;color:var(--quiet);white-space:nowrap;font-variant-numeric:tabular-nums;transition:background .3s,color .3s}
    .sig.pulse .sig-rule{background:var(--accent-soft);color:var(--accent)}
    .sig-dot{width:5px;height:5px;border-radius:50%;background:#3fb27f;box-shadow:0 0 0 2px rgba(63,178,127,.2);animation:sig-breathe 2.6s ease-in-out infinite}
    .sig.pulse .sig-dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    @keyframes sig-breathe{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
    .sig-body{display:flex;flex-direction:column;gap:2px;min-height:46px}
    .sig-body.swap{animation:sig-swap .42s var(--ease)}
    @keyframes sig-swap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    .sig-t{display:block;font-size:13px;font-weight:500;letter-spacing:-.015em;line-height:1.25;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sig-d{margin:0;font-size:11.5px;line-height:1.38;color:var(--quiet);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .sig-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;border-top:1px solid var(--line)}
    .sig-viz{display:flex;align-items:center;gap:6px;min-width:0;flex:1;font-size:10px;color:var(--quiet);font-variant-numeric:tabular-nums}
    .sv-tl{position:relative;flex:1;max-width:118px;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
    .sv-tl i{position:absolute;top:0;bottom:0;border-radius:2px;background:rgba(47,47,47,.22)}
    .sv-tl i.prop{background:var(--accent);animation:sig-breathe 1.8s ease-in-out infinite}
    .sv-tl b{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink);border-radius:1px}
    .sv-bars{display:inline-flex;align-items:flex-end;gap:2.5px;height:14px}
    .sv-bars i{width:4px;border-radius:1.5px;background:rgba(47,47,47,.22);transition:height .4s var(--spring),background .3s}
    .sv-bars i.on{background:var(--accent)}
    .sv-wx{display:inline-flex;align-items:center;gap:4px}
    .sv-wx svg{width:14px;height:14px;display:block}
    .sv-pins{display:inline-flex;align-items:center;gap:4px}
    .sv-pins span{padding:1px 5px;border-radius:4px;background:var(--chip);font-size:9.5px}
    .sv-pins span.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
    .sig-right{display:inline-flex;align-items:center;gap:6px;flex:none}
    .sig-dots{display:inline-flex;gap:3px;padding:2px}
    .sig-dots i{width:4px;height:4px;border-radius:2px;background:var(--faint);transition:width .35s var(--spring),background .25s}
    .sig-dots i.on{width:11px;background:var(--ink)}
    .sig-act{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border:0;border-radius:999px;background:var(--chip);color:var(--ink);font-size:10.5px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s,transform .3s var(--spring)}
    .sig-act:hover{background:var(--ink);color:var(--fog);transform:translateX(1px)}
    body.night .sig{background:rgba(33,33,35,.68);border-color:rgba(255,255,255,.07);box-shadow:none}

    /* quiet living background */

    /* one icon language: a tile with a white 1.5 stroke glyph */

    function defineModule(m,text,context=[]){
      const p=parse(text),prevText=context.join(" ");

        m.kind="results";m.item=cap(p.noun);m.data={query:p.noun,shoe:/sneak|shoe|кросс|кед|обув/i.test(p.noun),groups:makeResults(p.noun)};

      }else{
        const steps=p.steps.length>1?p.steps.map(cap):[T(`Find ${p.noun}`,`Найти: ${p.noun}`),`${vlabel(p.verb)}: ${p.noun}`,p.modifier?T(`Wait until ${p.modifier.replace(/^(when|if|once)\s+/i,"")}`,`Дождаться: ${p.modifier.replace(/^(когда|если|как только)\s+/i,"")}`):T("Confirm with you","Подтвердить с вами")];
        m.kind="result";m.data={steps,done:0};

    function runSteps(m){

    function runLine(m,text){
      text=text.trim();if(!text)return;
      const p=parse(text),low=text.toLowerCase(),card=cardOf(m);

        ["compose",/^(send|отправ)/,"sendnow"],["compose",/shorter|короче/,()=>{m.data.text=m.data.text.split(/(?<=[.!?])\s/)[0];refresh(m)}],

        ["options",/cheapest|дешёв/,()=>{const ps=m.data.opts.map(o=>+o.p.replace(/\D/g,""));m.data.sel=ps.indexOf(Math.min(...ps));DO.book(m)}],

        ["product",/bag|корзин/,"bag"],["alarm",/weather|погод/,"showWeather"],["alarm",/(\d{1,2})[:.](\d{2})/,()=>{const t=low.match(/(\d{1,2})[:.](\d{2})/);m.data.h=+t[1];m.data.mi=+t[2];refresh(m)}],
        ["weather",/umbrella|зонт/,"umbrella"],["map",/caf|кофейн|nearby|рядом/,"nearby"],["chart",/export|экспорт/,"export"],
        ["player",/share|подел/,"share"],["checklist",/^(share|отправить|поделиться)/,"share"],["options",/^(share|отправить)/,"share"],["weather",/^(share|отправить)/,"share"]
      ];
      /* live mode: longer, free-form instructions go to the model instead of the scripted shortcuts */
      const free=window.Live?.enabled()&&text.split(/\s+/).length>4;
      const q=free?null:QUICK.find(([k,re])=>k===m.kind&&re.test(low));
      if(q){typeof q[2]==="function"?q[2]():DO[q[2]](m,null,card);return}

      if(/resolved|keep the plan|keep going|решённое|оставить как есть|продолжить/.test(low)){m.kind="summary";m.item=T("Resolved","Решено");m.data={points:[T("Marked as resolved. Collaborators were notified.","Отмечено как решённое. Участники уведомлены.")]};refresh(m);return}
      if(/ghost line|last year|прошлый год/.test(low)){const ch=allModules().find(x=>x.kind==="chart");if(ch){ch.data.ghost=true;refresh(ch,false)}}
      if(/90 ?s|90 сек|timer|таймер/.test(low)){m.kind="result";m.item=T("Break · 90 s","Пауза · 90 с");m.data={steps:[T("Timer started","Таймер запущен"),T("Music volume lowered","Музыка тише"),T("Next set: squats 4 × 8","Следующий подход: присед 4 × 8")],done:0};refresh(m);runSteps(m);return}
      if(/calmer|спокойнее/.test(low)){const pl=allModules().find(x=>x.kind==="player");if(pl){pl.data.track=pl.data.tracks.length-1;pl.data.t=0;pl.data.playing=true;refresh(pl,false);showToast(T(`Playing “${pl.data.tracks[pl.data.track][0]}”`,`Играет «${pl.data.tracks[pl.data.track][0]}»`))}return m.kind==="suggest"?archive(m):undefined}
      if(/book a viewing|записаться на просмотр/.test(low)){const cal=allModules().find(x=>x.kind==="calendar");if(cal){const l=findModule(cal.id);focusModule(l.fi,l.mi)}return}
      const loc=findModule(m.id),parent=m.kind==="suggest"&&loc?.mi>0?S.flows[loc.fi].modules[loc.mi-1]:m;
      if(/^(New module|Новый модуль)$/.test(m.item))m.item=parent.item;
      if(loc&&/^(Flow|Поток) \d+$/.test(S.flows[loc.fi].name)){S.flows[loc.fi].name=cap(p.noun);const lb=$$("#flows .flow")[loc.fi]?.querySelector(".flow-label b");if(lb)lb.textContent=S.flows[loc.fi].name}

    /* ── Rules & collaborators are live ──────────────────────────────────────────

       A collaborator can be revoked (no more modules from it) or removed. */
    function ruleInfo(r){
      if(r._p&&r._t===r.text)return r._p;
      const t=r.text.toLowerCase(),m=t.match(/\d[\d\s\u00a0,.]*\d|\d/),num=m?+m[0].replace(/[\s\u00a0,]/g,""):null;
      let p={kind:"note"};
      if(r.auto)p={kind:"auto"};

      else if(/direct|прям/.test(t))p={kind:"direct"};
      else if(/archive|убирать модуль/.test(t))p={kind:"archive"};
      else if(num&&!/minute|минут|hour|час/.test(t)&&/[€$₽£]|eur|usd|rub|евро|руб|долл|under|up to|cheaper|at most|не дороже|дешевле/.test(t))p={kind:"budget",max:num};
      r._p=p;r._t=r.text;return p;
    }
    const rulesOf=k=>S?S.rules.filter(r=>r.on&&ruleInfo(r).kind===k):[];

    const budgetCap=()=>{const b=rulesOf("budget");return b.length?Math.min(...b.map(r=>ruleInfo(r).max)):null};
    const overBudget=p=>{const cap=budgetCap(),n=priceNum(p);return cap!=null&&n!=null&&n>cap};
    const notDirect=s=>rulesOf("direct").length>0&&!/direct|прям/i.test(s);
    const fmtEur=n=>"€"+n.toLocaleString(LANG==="ru"?"ru-RU":"en-US");
    function ruleEffect(r){
      const p=ruleInfo(r);
      return{unread:T("hides read items","скрывает прочитанное"),direct:T("flags non-direct flights","помечает рейсы с пересадкой"),archive:T("archives after you reply","убирает модуль после ответа"),
        budget:T(`flags anything over ${fmtEur(p.max||0)}`,`помечает всё дороже ${fmtEur(p.max||0)}`),auto:T("a collaborator may add modules","участник может добавлять модули"),note:T("note · no automatic effect","заметка · без автоматического действия")}[p.kind];

        days:D.time.map((d,k)=>({date:d,min:D.temperature_2m_min[k],max:D.temperature_2m_max[k],p:D.precipitation_probability_max[k]??0,kind:omKind(D.weather_code[k]),rise:D.sunrise[k].slice(11,16),set:D.sunset[k].slice(11,16),uv:D.uv_index_max[k]??0}))};
    }
    function fromWttr(j){
      const to24=s=>{const m=String(s).match(/(\d+):(\d+)\s*(AM|PM)/i);if(!m)return s;let h=+m[1]%12;if(/pm/i.test(m[3]))h+=12;return String(h).padStart(2,"0")+":"+m[2]};
      const cur=j.current_condition[0],P=mskParts(),key=`${P.year}-${P.month}-${P.day}`,hr=+P.hour;
      const days=j.weather.map(w=>({date:w.date,min:+w.mintempC,max:+w.maxtempC,p:Math.max(...w.hourly.map(h=>Math.max(+h.chanceofrain,+h.chanceofsnow))),kind:wwoKind((w.hourly[4]||w.hourly[0]).weatherCode),rise:to24(w.astronomy[0].sunrise),set:to24(w.astronomy[0].sunset),uv:+w.uvIndex||0}));
      const flat=j.weather.flatMap(w=>w.hourly.map(h=>({date:w.date,h:+h.time/100,t:+h.tempC,p:Math.max(+h.chanceofrain,+h.chanceofsnow),kind:wwoKind(h.weatherCode),day:+h.time>=700&&+h.time<1900})));
      const s=Math.max(0,flat.findIndex(x=>x.date>key||(x.date===key&&x.h+3>hr)));
      const rise=days[0]?.rise||"07:00",set=days[0]?.set||"18:00",nm=hr*60+ +P.minute,mins=s=>{const[a,b]=s.split(":");return+a*60+ +b};
      const now={t:+cur.temp_C,feels:+cur.FeelsLikeC,kind:wwoKind(cur.weatherCode),day:nm>=mins(rise)&&nm<mins(set),wind:+cur.windspeedKmph/3.6,hum:+cur.humidity,pres:+cur.pressure};
      return{src:"wttr.in",now,hours:[{h:hr,t:now.t,p:flat[s]?.p||0,kind:now.kind,day:now.day},...flat.slice(s+1,s+9)],days};
    }
    function wxMock(){
      const P=mskParts(),hr=+P.hour,base=new Date(`${P.year}-${P.month}-${P.day}T12:00`);
      const days=[...Array(7)].map((_,k)=>{const d=new Date(base);d.setDate(d.getDate()+k);const mx=11-k*.6+(k%3?1.5:-1),kinds=["partly","cloudy","rain","partly","clear","cloudy","drizzle"];return{date:d.toISOString().slice(0,10),min:Math.round(mx-6),max:Math.round(mx),p:[10,30,80,20,0,40,60][k],kind:kinds[k],rise:"07:32",set:"17:48",uv:[2,1,1,2,3,1,1][k]}});
      const hours=[...Array(9)].map((_,i)=>{const h=(hr+i*3)%24;return{h,t:6+5*Math.sin((h-9)/24*2*Math.PI),p:i>4?40:10,kind:i>4?"rain":"partly",day:h>=8&&h<18}});
      return{src:T("demo data","демо-данные"),now:{t:hours[0].t,feels:hours[0].t-2,kind:"partly",day:hr>=8&&hr<18,wind:4,hum:72,pres:1016},hours,days};
    }
    async function loadWeather(){
      try{const c=JSON.parse(sessionStorage.getItem("wx")||"null");if(c&&Date.now()-c.at<15*60e3){WXD=c.d;WXD.at=c.at;return renderWx()}}catch{}
      const om="https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,is_day,pressure_msl&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max&timezone=Europe%2FMoscow&forecast_days=7&wind_speed_unit=ms";
      let d=null;
      try{d=fromOM(await getJSON(om,5000))}catch{try{d=fromWttr(await getJSON("https://wttr.in/Moscow?format=j1",9000))}catch{}}
      const at=Date.now();
      if(d)try{sessionStorage.setItem("wx",JSON.stringify({at,d}))}catch{}
      WXD=d||wxMock();WXD.at=at;renderWx();
    }
    const TSTOPS=[[-15,[110,150,255]],[0,[95,185,240]],[10,[110,205,165]],[17,[240,205,90]],[25,[245,150,70]],[33,[235,85,80]]];
    function tempColor(t){
      if(t<=TSTOPS[0][0])return`rgb(${TSTOPS[0][1]})`;
      for(let i=1;i<TSTOPS.length;i++){const[a,ca]=TSTOPS[i-1],[b,cb]=TSTOPS[i];if(t<=b){const f=(t-a)/(b-a);return`rgb(${ca.map((v,k)=>Math.round(v+(cb[k]-v)*f))})`}}
      return`rgb(${TSTOPS.at(-1)[1]})`;
    }
    function hoursSVG(hs){
      const W=320,n=hs.length,x=i=>14+i*(W-28)/(n-1),ts=hs.map(h=>h.t),mn=Math.min(...ts),mx=Math.max(mn+4,Math.max(...ts)),y=t=>30+(1-(t-mn)/(mx-mn))*28;
      const P=hs.map((h,i)=>[x(i),y(h.t)]);
      let d=`M${P[0][0]},${P[0][1]}`;
      for(let i=0;i<n-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}
      const avg=ts.reduce((a,b)=>a+b,0)/n;
      return`<svg viewBox="0 0 ${W} 118"><defs><linearGradient id="wxg" x1="${x(0)}" x2="${x(n-1)}" gradientUnits="userSpaceOnUse">${hs.map((h,i)=>`<stop offset="${i/(n-1)}" stop-color="${tempColor(h.t)}"/>`).join("")}</linearGradient><linearGradient id="wxa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${tempColor(avg)}" stop-opacity=".32"/><stop offset="1" stop-color="${tempColor(avg)}" stop-opacity="0"/></linearGradient></defs>
        <path class="wz-area" d="${d} L${x(n-1)},70 L${x(0)},70Z" fill="url(#wxa)"/>
        <path class="wz-line" d="${d}" pathLength="1" fill="none" stroke="url(#wxg)" stroke-width="2.4" stroke-linecap="round"/>
        ${hs.map((h,i)=>`<circle cx="${P[i][0]}" cy="${P[i][1]}" r="${i?2.4:3.6}" fill="${i?"var(--paper)":tempColor(h.t)}" stroke="${tempColor(h.t)}" stroke-width="1.6"/>
        <text x="${P[i][0]}" y="${P[i][1]-9}" text-anchor="middle" font-size="10.5" fill="var(--ink)" font-weight="${i?400:600}">${deg(h.t)}</text>
        <svg x="${P[i][0]-8}" y="76" width="16" height="16" viewBox="0 0 24 24">${WX[wxGlyph(h.kind,h.day)]}</svg>
        ${h.p>=20?`<text x="${P[i][0]}" y="101" text-anchor="middle" font-size="8.5" fill="#4f8fe8">${Math.round(h.p)}%</text>`:""}
        <text x="${P[i][0]}" y="114" text-anchor="middle" font-size="9.5" fill="var(--quiet)">${i?String(h.h).padStart(2,"0"):T("Now","Сейчас")}</text>`).join("")}</svg>`;
    }
    function renderWx(){
      if(!WXD)return;const n=WXD.now;
      $("#wxIco").innerHTML=wx(wxGlyph(n.kind,n.day));$("#wxTemp").textContent=deg(n.t);
      $("#wxBtn").title=`${T("Moscow","Москва")} · ${wxName(n.kind)}`;
      if($("#wxWrap").classList.contains("open"))renderWxPop();
    }
    function renderWxPop(){
      if(!WXD){$("#wxPop").innerHTML=`<div class="wz-top"><b>${T("Moscow","Москва")}</b><span>${T("Loading…","Загружаю…")}</span></div>`;return}
      const W=WXD,n=W.now,t0=W.days[0]||{min:n.t,max:n.t,rise:"07:00",set:"18:00",uv:0};
      const gmin=Math.min(n.t,...W.days.map(d=>d.min)),gmax=Math.max(n.t,...W.days.map(d=>d.max)),span=Math.max(1,gmax-gmin);
      const loc=LANG==="ru"?"ru-RU":"en-GB",cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
      const days=W.days.map((d,k)=>{
        const name=k?cap(new Date(d.date+"T12:00").toLocaleDateString(loc,{weekday:"short"}).replace(".","")):T("Today","Сегодня");
        const l=(d.min-gmin)/span*100,w=Math.max(4,(d.max-d.min)/span*100);
        return`<div class="wz-day"><span class="d">${name}</span>${wx(wxGlyph(d.kind))}<span class="p">${d.p>=20?Math.round(d.p)+"%":""}</span><span class="mn">${deg(d.min)}</span><div class="wz-range"><i style="left:${l}%;width:${w}%;--c1:${tempColor(d.min)};--c2:${tempColor(d.max)};animation-delay:${.15+k*.05}s"></i>${k?"":`<b style="left:${(n.t-gmin)/span*100}%"></b>`}</div><span class="mx">${deg(d.max)}</span></div>`;
      }).join("");
      const P=mskParts(),nm=+P.hour*60+ +P.minute,mins=s=>{const[a,b]=s.split(":");return+a*60+ +b},rise=mins(t0.rise),set=mins(t0.set),f=Math.min(1,Math.max(0,(nm-rise)/(set-rise)));
      const sx=66-56*Math.cos(Math.PI*f),sy=46-38*Math.sin(Math.PI*f),dl=set-rise;
      const wind=n.wind,windTxt=wind<2?T("Calm","Штиль"):wind<5?T("Light","Слабый"):wind<9?T("Moderate","Умеренный"):T("Strong","Сильный");
      const hum=Math.round(n.hum),humTxt=hum<35?T("Dry","Сухо"):hum<70?T("Comfortable","Комфортно"):T("Humid","Влажно");
      const mm=Math.round(n.pres*.750062),presTxt=mm<750?T("Low","Пониженное"):mm>770?T("High","Повышенное"):T("Normal","В норме");
      const uv=Math.round(t0.uv),uvTxt=uv<=2?T("Low","Низкий"):uv<=5?T("Moderate","Умеренный"):uv<=7?T("High","Высокий"):T("Very high","Очень высокий");
      $("#wxPop").innerHTML=`
        <div class="wz-top"><b>${T("Moscow","Москва")}</b><span>${mskTime(new Date())} MSK</span></div>
        <div class="wz-now"><span class="glyph">${wx(wxGlyph(n.kind,n.day))}</span><div><div class="wz-big">${deg(n.t)}</div></div><div class="wz-hl"><b>${wxName(n.kind)}</b><br>${T("Feels like","Ощущается как")} ${deg(n.feels)}<br>↑${deg(t0.max)} ↓${deg(t0.min)}</div></div>
        <div class="wz-sec wz-hours"><div class="wz-label">${T("Next 24 hours","Ближайшие сутки")}</div>${hoursSVG(W.hours)}</div>
        <div class="wz-sec"><div class="wz-label">${count(W.days.length,["day","days"],["день","дня","дней"])}</div>${days}</div>
        <div class="wz-sec wz-grid">
          <div class="wz-tile"><small>${T("Wind","Ветер")}</small><b>${Math.round(wind)}<em>${T("m/s","м/с")}</em></b><span>${windTxt}</span><div class="wz-meter"><i style="width:${Math.min(100,wind/15*100)}%"></i></div></div>
          <div class="wz-tile"><small>${T("Humidity","Влажность")}</small><b>${hum}<em>%</em></b><span>${humTxt}</span><div class="wz-meter"><i style="width:${hum}%;--mc:#4f8fe8"></i></div></div>
          <div class="wz-tile"><small>${T("Pressure","Давление")}</small><b>${LANG==="ru"?mm:Math.round(n.pres)}<em>${T("hPa","мм рт. ст.")}</em></b><span>${presTxt}</span><div class="wz-meter"><i style="width:${Math.min(100,Math.max(0,(mm-730)/60*100))}%"></i></div></div>
          <div class="wz-tile"><small>${T("UV index","УФ-индекс")}</small><b>${uv}</b><span>${uvTxt}</span><div class="wz-meter uv"><b style="left:${Math.min(100,uv/11*100)}%"></b></div></div>
          <div class="wz-tile wz-sun"><svg viewBox="0 0 132 52"><path d="M10 46 A56 38 0 0 1 122 46" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 4"/><path class="wz-line" d="M10 46 A56 38 0 0 1 122 46" pathLength="1" fill="none" stroke="#f2b84b" stroke-width="2" style="stroke-dasharray:${f} 1;stroke-dashoffset:${f};animation-name:wxdraw"/><line x1="2" x2="130" y1="46" y2="46" stroke="var(--line)"/>${f>0&&f<1?`<circle cx="${sx}" cy="${sy}" r="5" fill="#f2b84b"/><circle cx="${sx}" cy="${sy}" r="9" fill="#f2b84b" opacity=".2"/>`:""}</svg>
            <dl><dt>${T("Sunrise","Восход")}</dt><dd>${t0.rise}</dd><dt>${T("Sunset","Закат")}</dt><dd>${t0.set}</dd><dt>${T("Daylight","Световой день")}</dt><dd>${Math.floor(dl/60)} ${T("h","ч")} ${dl%60} ${T("min","мин")}</dd></dl></div>
        </div>
        <div class="wz-foot">${T("Updated","Обновлено")} ${mskTime(new Date(W.at))} · ${W.src}</div>`;
    }
    const wxWrap=$("#wxWrap"),setWx=o=>{wxWrap.classList.toggle("open",o);$("#wxBtn").setAttribute("aria-expanded",o);if(o){setMenu(false);renderWxPop()}};
    $("#wxBtn").onclick=e=>{e.stopPropagation();setWx(!wxWrap.classList.contains("open"))};
    document.addEventListener("click",e=>{if(!e.target.closest("#wxPop,#wxBtn"))setWx(false)});
    addEventListener("keydown",e=>{if(e.key==="Escape"&&wxWrap.classList.contains("open")){e.stopImmediatePropagation();setWx(false)}},true);
    loadWeather();setInterval(loadWeather,15*60e3);

    function tickClock(){const d=new Date(),t=timeStr(d);$("#clock").innerHTML=`${mskTime(d)}<span class="tz">MSK</span>`;$("#homeTime").textContent=t;$("#homeDate").textContent=d.toLocaleDateString(LANG==="ru"?"ru-RU":"en-GB",{weekday:"long",day:"numeric",month:"long"})}
    setInterval(tickClock,15000);
    applyLang();
    const qs=params.get("space");
    if(qs&&BP[qs])openSpace(BP[qs]());
    else if(params.get("view")==="timeline")setView("timeline");
    else{setTimeout(()=>$("#intentInput").focus(),200);staggerIn($$(".home-time,.home-date,.home-line,.blueprints,.home-apps,.timeline-hint"),18,70)}
  </script>
  <script src="/demos/intent-os/live.js"></script>
</body>
